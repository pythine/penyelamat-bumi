<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feed Video</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c15a;--gold2:#b8802a;--ink:#07060a;--glass:rgba(20,14,12,.62)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Tidak ada overflow:hidden di body. Yang meng-scroll adalah halaman (html) dengan scroll-snap, 1 layar = 1 video. */
html{background:var(--ink);scroll-snap-type:y mandatory;overflow-y:scroll;overscroll-behavior-y:contain;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{margin:0;color:#fff;background:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:800}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.ms{font-family:'Material Symbols Rounded';font-weight:500;font-style:normal;font-size:1.2em;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;width:1em;height:1em;overflow:hidden;white-space:nowrap;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}

.slide{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.poster{position:absolute;inset:0;background:#000 center/contain no-repeat;transition:opacity .4s}
.slide.ready .poster{opacity:0}
.player{position:absolute;inset:0;z-index:1}
.player iframe{width:100%;height:100%;border:0;display:block}
.tap{position:absolute;inset:0;z-index:2}
.pause{position:absolute;left:50%;top:50%;z-index:3;transform:translate(-50%,-50%) scale(.6);width:84px;height:84px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;opacity:0;transition:.18s;pointer-events:none}
.pause .ms{font-size:52px;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.slide.paused .pause{opacity:1;transform:translate(-50%,-50%) scale(1)}
.scrim{position:absolute;left:0;right:0;bottom:0;height:42%;z-index:3;background:linear-gradient(transparent,rgba(0,0,0,.78));pointer-events:none}
.info{position:absolute;left:14px;right:84px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:4;pointer-events:none;text-shadow:0 1px 6px #000}
.info .ch{display:inline-flex;align-items:center;gap:6px;font-size:16px;color:var(--gold)}
.info .ch .ms{font-size:20px;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.info .tt{margin:6px 0 0;font-size:15px;line-height:1.35;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.side{position:absolute;right:10px;bottom:calc(30px + env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;align-items:center;gap:16px}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;text-shadow:0 1px 4px #000}
.rb i{width:50px;height:50px;border-radius:50%;background:var(--glass);border:1px solid rgba(245,193,90,.45);backdrop-filter:blur(6px);display:grid;place-items:center;font-style:normal;transition:.15s}
.rb:active i{transform:scale(.9)}
.rb .ms{font-size:28px}
.rb.like.on i{background:rgba(255,77,106,.25);border-color:#ff4d6a}
.rb.like.on .ms{color:#ff4d6a;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.burst{position:absolute;z-index:6;font-size:84px;color:#ff4d6a;pointer-events:none;transform:translate(-50%,-50%);animation:burst .8s ease-out forwards;text-shadow:0 0 18px #ff4d6a88}
.burst .ms{font-size:84px;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-60%) scale(1.15);opacity:1}100%{transform:translate(-50%,-110%) scale(1);opacity:0}}

.top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;max-width:520px;margin:0 auto;background:linear-gradient(rgba(0,0,0,.6),transparent);pointer-events:none}
.top>*{pointer-events:auto}
.top .bk{display:flex;align-items:center;gap:4px;height:40px;padding:0 14px 0 8px;border-radius:999px;background:var(--glass);border:1px solid rgba(245,193,90,.45);backdrop-filter:blur(6px);font-size:14px}
.top .bk .ms{font-size:24px}
.top b{flex:1;text-align:center;font-size:16px;color:var(--gold);text-shadow:0 1px 6px #000;pointer-events:none}
.top .snd{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid rgba(245,193,90,.45);backdrop-filter:blur(6px);display:grid;place-items:center}
.top .snd .ms{font-size:24px}.top .snd.off{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,193,90,.55)}50%{box-shadow:0 0 0 8px rgba(245,193,90,0)}}

.msg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px;background:radial-gradient(ellipse 80% 30% at 50% 50%,rgba(245,193,90,.18),transparent 70%),linear-gradient(#050405,#0c0806 55%,#1b1007)}
.msg .big{font-size:56px}.msg h3{margin:0;font-size:20px;color:var(--gold)}.msg p{margin:0;max-width:320px;color:#cdbfae;font-size:14px;line-height:1.5;font-weight:700}
.msg code{background:#ffffff18;padding:2px 6px;border-radius:6px;font-size:12px}
.btn{padding:12px 26px;border-radius:999px;background:var(--gold);color:#2a1700;font-weight:900;font-size:15px}
.btn.o{background:#ffffff14;color:#fff;border:1px solid rgba(245,193,90,.5)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid #ffffff22;border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

#sform{position:fixed;left:0;right:0;top:calc(62px + env(safe-area-inset-top));z-index:22;max-width:520px;margin:0 auto;padding:0 12px;display:flex;gap:8px}
#sform[hidden]{display:none}
#sq{flex:1;min-width:0;height:44px;border-radius:999px;border:1.5px solid rgba(245,193,90,.6);background:rgba(20,14,12,.92);color:#fff;font:inherit;font-size:15px;padding:0 16px;outline:0;-webkit-appearance:none}
#sq:focus{border-color:var(--gold)}
#sform button{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#2a1700;display:grid;place-items:center;flex:none}
#sform button.x{background:var(--glass);color:#fff;border:1px solid rgba(245,193,90,.45)}
#sform .ms{font-size:24px}
#recent{position:fixed;left:0;right:0;top:calc(114px + env(safe-area-inset-top));z-index:22;max-width:520px;margin:0 auto;padding:0 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#recent:empty{display:none}
#recent small{width:100%;color:#cdbfae;font-size:12px;text-shadow:0 1px 4px #000}
#recent button{padding:7px 14px;border-radius:999px;background:rgba(20,14,12,.88);border:1px solid rgba(245,193,90,.45);font-size:13px}
#sheetBg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);touch-action:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;height:68dvh;background:#150f0b;border:1px solid rgba(245,193,90,.35);border-bottom:0;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s ease}
#sheet.on{transform:none}
#sheet .sh{display:flex;align-items:center;padding:14px 16px 10px}
#sheet .sh b{flex:1;font-size:16px;color:var(--gold)}
#sheet .sh button{width:34px;height:34px;border-radius:50%;background:#ffffff14}
#sheet .sb{flex:1;overflow:auto;padding:0 16px 8px;overscroll-behavior:contain}
.cm{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff12}
.cm img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#2a1c12;flex:none}
.cm .tx{min-width:0;flex:1}.cm b{font-size:13px;color:#ffe3a6}.cm small{color:#8d8176;font-weight:700}
.cm p{margin:3px 0 0;font-size:14px;font-weight:600;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.cm .lk{font-size:12px;color:#a99d92;display:flex;align-items:center;gap:3px;margin-top:3px}.cm .lk .ms{font-size:15px}
#sheet .sf{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #ffffff12}
#sheet .sf .btn{width:100%}
.sub{color:#a99d92;font-size:13px;text-align:center;padding:24px 0;font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#000d;border:1px solid var(--gold);border-radius:999px;padding:9px 18px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>

<div class="top">
  <button class="bk" id="back" title="Kembali ke halaman utama"><span class="ms">arrow_back_ios_new</span>Kembali</button>
  <b>Feed Video</b>
  <button class="snd" id="srch" title="Cari video"><span class="ms">search</span></button>
  <button class="snd off" id="snd" title="Suara"><span class="ms">volume_off</span></button>
</div>

<form id="sform" hidden autocomplete="off">
  <input id="sq" type="search" enterkeyhint="search" maxlength="80" placeholder="Cari video apa saja…">
  <button type="submit" title="Cari"><span class="ms">search</span></button>
  <button type="button" class="x" id="sx" title="Tutup"><span class="ms">close</span></button>
</form>
<div id="recent"></div>

<main id="feed"></main>

<div id="sheetBg" hidden></div>
<div id="sheet"><div class="sh"><b id="shT">Komentar</b><button id="shX" title="Tutup"><span class="ms">close</span></button></div><div class="sb" id="shB"></div><div class="sf" id="shF"></div></div>
<div id="toast"></div>

<script>
/* =====================================================================
   PENGATURAN — ISI DI SINI
   ===================================================================== */
const YOUTUBE_API_KEY = "AIzaSyDoHMuUXxm01t_jxafTVSKTC8FfXIOrUmg";   // YouTube Data API v3 (Google Cloud Console)
const KEYWORD = "";                                      // kata kunci awal (kosong = pengguna mencari sendiri; isi mis. "kucing lucu" untuk topik awal)
const ORDER = "date";                                    // urutan hasil: "date" (terbaru) atau "relevance" (paling sesuai)
const SARAN = ["musik", "lucu", "game", "masak", "olahraga", "edukasi", "hewan", "alam"]; // chip saran pencarian
const MAX_RESULTS = 20;                                  // video per pengambilan (maks. 50)
const CACHE_MENIT = 20;                                  // hasil disimpan sementara agar kuota API hemat
/* ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const feed = $('#feed');
const ls = k => { try { return localStorage.getItem(k) } catch { return null } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v) } catch { } };
const dec = s => { const t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value };
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + ' jt' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + ' rb' : String(n);
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2300) }

let items = [], nextToken = '', loadingMore = false, active = -1, userPaused = false, reqId = 0;
let keyword = (ls('vf_kw') || KEYWORD || '').trim();
let soundOn = ls('vf_sound') === '1';
const liked = new Set((() => { try { return JSON.parse(ls('vf_likes') || '[]') } catch { return [] } })());

/* ---------- YouTube Data API ---------- */
async function yt(path, params) {
  const u = new URL('https://www.googleapis.com/youtube/v3/' + path);
  Object.entries({ ...params, key: YOUTUBE_API_KEY }).forEach(([k, v]) => { if (v !== '' && v != null) u.searchParams.set(k, v) });
  const r = await fetch(u), j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error?.message || 'HTTP ' + r.status); e.reason = j.error?.errors?.[0]?.reason || ''; e.status = r.status; throw e }
  return j;
}
function errText(e) {
  const r = e.reason || '';
  if (r === 'quotaExceeded' || r === 'dailyLimitExceeded' || r === 'rateLimitExceeded') return ['Kuota YouTube API habis', 'Kuota harian YouTube Data API sudah terpakai. Coba lagi besok (kuota reset sekitar tengah malam waktu Pasifik).'];
  if (r === 'keyInvalid' || /API key not valid/i.test(e.message)) return ['API Key tidak valid', 'Periksa lagi isi YOUTUBE_API_KEY di video.html.'];
  if (r === 'accessNotConfigured' || /has not been used|is disabled/i.test(e.message)) return ['YouTube API belum aktif', 'Aktifkan "YouTube Data API v3" di proyek Google Cloud tempat API Key dibuat.'];
  if (r === 'ipRefererBlocked' || /referer/i.test(e.message)) return ['API Key dibatasi domain', 'Tambahkan domain situs ini ke daftar "HTTP referrers" pada API Key di Google Cloud.'];
  if (e instanceof TypeError) return ['Tidak ada koneksi', 'Periksa internetmu lalu coba lagi.'];
  return ['Gagal memuat video', e.message || 'Terjadi kesalahan.'];
}
async function fetchPage(token) {
  const s = await yt('search', { part: 'snippet', type: 'video', videoDuration: 'short', videoEmbeddable: 'true', maxResults: MAX_RESULTS, order: ORDER, q: keyword, pageToken: token || '' });
  const rows = (s.items || []).filter(x => x.id?.videoId), ids = rows.map(x => x.id.videoId), st = {};
  if (ids.length) { try { const v = await yt('videos', { part: 'statistics', id: ids.join(',') }); (v.items || []).forEach(x => st[x.id] = x.statistics || {}) } catch { } }
  return {
    next: s.nextPageToken || '',
    items: rows.map(x => ({ id: x.id.videoId, title: dec(x.snippet.title), channel: dec(x.snippet.channelTitle), likes: Number(st[x.id.videoId]?.likeCount || 0), comments: Number(st[x.id.videoId]?.commentCount || 0) }))
  };
}
const cacheKey = () => 'vf_cache_' + ORDER + '_' + keyword.toLowerCase();
function readCache() { try { const c = JSON.parse(ls(cacheKey()) || 'null'); return c && Date.now() - c.t < CACHE_MENIT * 6e4 && c.items?.length ? c : null } catch { return null } }
const writeCache = () => lsSet(cacheKey(), JSON.stringify({ t: Date.now(), items, next: nextToken }));

/* ---------- tampilan ---------- */
function showMsg(icon, title, text, retry) {
  feed.innerHTML = `<section class="slide msg"><div class="big">${icon}</div><h3></h3><p></p>${retry ? '<button class="btn" id="retry">Coba lagi</button>' : ''}<button class="btn o" id="back2">Kembali</button></section>`;
  $('.msg h3').textContent = title; $('.msg p').innerHTML = ''; $('.msg p').append(text);
  $('#back2').onclick = goBack; if (retry) $('#retry').onclick = init;
}
const showLoading = () => feed.innerHTML = '<section class="slide msg"><div class="spin"></div><p>Memuat video…</p></section>';

function slideEl(it, i) {
  const s = document.createElement('section');
  s.className = 'slide'; s.dataset.i = i; s.dataset.id = it.id;
  s.innerHTML = `<div class="poster" style="background-image:url(https://i.ytimg.com/vi/${it.id}/hqdefault.jpg)"></div><div class="player"></div><div class="tap"></div>
    <div class="pause"><span class="ms">play_arrow</span></div><div class="scrim"></div>
    <div class="info"><span class="ch"><span class="ms">account_circle</span><span class="chn"></span></span><p class="tt"></p></div>
    <div class="side">
      <button class="rb like" data-act="like"><i><span class="ms">favorite</span></i><span class="n"></span></button>
      <button class="rb" data-act="cmt"><i><span class="ms">chat_bubble</span></i><span>${it.comments ? fmt(it.comments) : 'Komentar'}</span></button>
      <button class="rb" data-act="share"><i><span class="ms">share</span></i><span>Bagikan</span></button>
    </div>`;
  $('.chn', s).textContent = it.channel; $('.tt', s).textContent = it.title;
  paintLike(s); return s;
}
function paintLike(s) {
  const it = items[+s.dataset.i], on = liked.has(it.id), b = $('.like', s);
  b.classList.toggle('on', on); $('.n', b).textContent = fmt(it.likes + (on ? 1 : 0));
}
function render(from) {
  if (!from) { feed.innerHTML = ''; active = -1 }
  for (let i = from; i < items.length; i++) { const s = slideEl(items[i], i); feed.append(s); io.observe(s) }
}

/* ---------- pemutar: hanya video yang sedang tampil yang dimuat ---------- */
const cmd = (f, func, args = []) => { try { f?.contentWindow?.postMessage(JSON.stringify({ event: 'command', func, args }), '*') } catch { } };
const activeFrame = () => $(`.slide[data-i="${active}"] iframe`);
function activate(i) {
  if (i === active) return;
  document.querySelectorAll('.slide iframe').forEach(f => f.remove());
  document.querySelectorAll('.slide.ready,.slide.paused').forEach(s => s.classList.remove('ready', 'paused'));
  active = i; userPaused = false;
  const s = $(`.slide[data-i="${i}"]`); if (!s) return;
  const id = s.dataset.id, og = location.origin && location.origin !== 'null' ? '&origin=' + encodeURIComponent(location.origin) : '';
  const f = document.createElement('iframe');
  f.allow = 'autoplay; encrypted-media; picture-in-picture'; f.setAttribute('allowfullscreen', ''); f.title = items[i].title;
  f.src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&modestbranding=1&loop=1&playlist=${id}&enablejsapi=1&iv_load_policy=3&fs=0&disablekb=1${og}`;
  f.onload = () => {
    setTimeout(() => { s.classList.add('ready'); if (soundOn) { cmd(f, 'unMute'); cmd(f, 'setVolume', [100]) } }, 700);
    if (soundOn) setTimeout(() => cmd(f, 'unMute'), 1800);
  };
  $('.player', s).append(f);
  if (i >= items.length - 3) loadMore();
}
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting && en.intersectionRatio >= .6) activate(+en.target.dataset.i) }), { threshold: [.6] });

async function loadMore() {
  if (loadingMore || !nextToken) return; loadingMore = true; const kw = keyword;
  try {
    const p = await fetchPage(nextToken); if (kw !== keyword) return;
    const seen = new Set(items.map(x => x.id)), fresh = p.items.filter(x => !seen.has(x.id));
    nextToken = p.next; const from = items.length; items.push(...fresh); render(from); writeCache();
  } catch (e) { toast(errText(e)[0]) } finally { loadingMore = false }
}

/* ---------- interaksi ---------- */
function togglePause(s) {
  const f = $('iframe', s); if (!f) return;
  userPaused = !userPaused; cmd(f, userPaused ? 'pauseVideo' : 'playVideo'); s.classList.toggle('paused', userPaused);
}
function setLike(s, on) {
  const id = s.dataset.id; on ? liked.add(id) : liked.delete(id);
  lsSet('vf_likes', JSON.stringify([...liked].slice(-500))); paintLike(s);
}
function burst(s, x, y) {
  const b = document.createElement('div'); b.className = 'burst'; b.innerHTML = '<span class="ms">favorite</span>';
  const r = s.getBoundingClientRect(); b.style.left = (x - r.left) + 'px'; b.style.top = (y - r.top) + 'px'; s.append(b); setTimeout(() => b.remove(), 850);
}
let tapT = null;
feed.addEventListener('click', e => {
  const s = e.target.closest('.slide'); if (!s || s.classList.contains('msg')) return;
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'like') return setLike(s, !liked.has(s.dataset.id));
  if (act === 'cmt') return openComments(s);
  if (act === 'share') return share(s);
  if (!e.target.closest('.tap')) return;
  if (tapT) { clearTimeout(tapT); tapT = null; burst(s, e.clientX, e.clientY); setLike(s, true); return } /* ketuk 2x = suka */
  tapT = setTimeout(() => { tapT = null; togglePause(s) }, 260);                                      /* ketuk 1x = jeda/putar */
});
$('#snd').onclick = () => {
  soundOn = !soundOn; lsSet('vf_sound', soundOn ? '1' : '0'); paintSnd();
  const f = activeFrame(); if (f) { cmd(f, soundOn ? 'unMute' : 'mute'); if (soundOn) cmd(f, 'setVolume', [100]) }
};
function paintSnd() { const b = $('#snd'); b.classList.toggle('off', !soundOn); $('.ms', b).textContent = soundOn ? 'volume_up' : 'volume_off' }

async function share(s) {
  const it = items[+s.dataset.i], url = 'https://www.youtube.com/watch?v=' + it.id;
  try { if (navigator.share) { await navigator.share({ title: it.title, text: it.title, url }); return } } catch (e) { if (e?.name === 'AbortError') return }
  try { await navigator.clipboard.writeText(url); toast('Link video disalin 🔗') } catch { prompt('Salin link video:', url) }
}

/* komentar (dibaca dari YouTube; menulis komentar lewat YouTube) */
async function openComments(s) {
  const it = items[+s.dataset.i];
  $('#shT').textContent = 'Komentar' + (it.comments ? ' · ' + fmt(it.comments) : '');
  $('#shB').innerHTML = '<div class="sub">Memuat komentar…</div>';
  $('#shF').innerHTML = '<button class="btn o" id="ytc">Tulis komentar di YouTube</button>';
  $('#ytc').onclick = () => window.open('https://www.youtube.com/watch?v=' + it.id, '_blank', 'noopener');
  $('#sheetBg').hidden = false; $('#sheet').classList.add('on');
  try {
    const j = await yt('commentThreads', { part: 'snippet', videoId: it.id, maxResults: 30, order: 'relevance', textFormat: 'plainText' });
    const box = $('#shB'); box.innerHTML = '';
    if (!(j.items || []).length) { box.innerHTML = '<div class="sub">Belum ada komentar.</div>'; return }
    j.items.forEach(x => {
      const c = x.snippet.topLevelComment.snippet, d = document.createElement('div'); d.className = 'cm';
      d.innerHTML = '<img alt=""><div class="tx"><b></b> <small></small><p></p><div class="lk"><span class="ms">favorite</span><span></span></div></div>';
      $('img', d).src = c.authorProfileImageUrl || ''; $('b', d).textContent = c.authorDisplayName || 'Pengguna';
      $('small', d).textContent = new Date(c.publishedAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
      $('p', d).textContent = c.textDisplay || ''; $('.lk span:last-child', d).textContent = fmt(Number(c.likeCount || 0)); box.append(d);
    });
  } catch (e) {
    $('#shB').innerHTML = `<div class="sub">${e.reason === 'commentsDisabled' ? 'Komentar dinonaktifkan untuk video ini.' : 'Komentar tidak bisa dimuat.<br>' + errText(e)[0]}</div>`;
  }
}
function closeSheet() { $('#sheet').classList.remove('on'); $('#sheetBg').hidden = true }
$('#shX').onclick = closeSheet; $('#sheetBg').onclick = closeSheet;

function goBack() {
  try { if (window.parent !== window && window.parent.VideoAPI) return window.parent.VideoAPI.close() } catch { }
  history.length > 1 ? history.back() : toast('Tutup tab ini untuk keluar');
}
$('#back').onclick = goBack;
document.addEventListener('visibilitychange', () => { const f = activeFrame(); if (!f) return; if (document.hidden) cmd(f, 'pauseVideo'); else if (!userPaused) cmd(f, 'playVideo') });
document.addEventListener('keydown', e => { if (e.key === 'ArrowDown') scrollBy({ top: innerHeight, behavior: 'smooth' }); if (e.key === 'ArrowUp') scrollBy({ top: -innerHeight, behavior: 'smooth' }); if (e.key === 'Escape') closeSheet() });
window.addEventListener('pagehide', () => document.querySelectorAll('.slide iframe').forEach(f => f.remove()));

/* ---------- mulai ---------- */
async function init() {
  paintSnd(); const my = ++reqId;
  if (!YOUTUBE_API_KEY || /^ISI_/.test(YOUTUBE_API_KEY)) {
    const p = document.createElement('span'); p.innerHTML = 'Buka file <code>video.html</code>, cari baris <code>const YOUTUBE_API_KEY</code>, lalu tempel API Key YouTube Data API v3 milikmu.';
    return showMsg('🔑', 'API Key belum diisi', p);
  }
  if (!keyword) { showMsg('🔎', 'Cari video favoritmu', 'Ketik kata kunci apa saja, atau pilih salah satu saran di atas.'); return openSearch() }
  const c = readCache();
  if (c) { items = c.items; nextToken = c.next || ''; return render(0) }
  showLoading();
  try {
    const p = await fetchPage(''); if (my !== reqId) return; items = p.items; nextToken = p.next;
    if (!items.length) return showMsg('🎬', 'Video tidak ditemukan', `Tidak ada video pendek untuk "${keyword}". Coba kata kunci lain.`, false), openSearch();
    render(0); writeCache();
    toast('Geser ke atas untuk video berikutnya · ketuk 🔊 untuk suara');
  } catch (e) { if (my !== reqId) return; const [t, m] = errText(e); showMsg('⚠️', t, m, true) }
}

/* ---------- pencarian oleh pengguna ---------- */
const recents = () => { try { return JSON.parse(ls('vf_recent') || '[]') } catch { return [] } };
function renderRecent() {
  const r = recents(), box = $('#recent'); box.innerHTML = '';
  const add = (label, list) => { if (!list.length) return; const h = document.createElement('small'); h.textContent = label; box.append(h); list.forEach(q => { const b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.onclick = () => doSearch(q); box.append(b) }) };
  add('Terakhir dicari', r); add('Saran', SARAN.filter(x => !r.includes(x)).slice(0, 6));
}
function openSearch() { $('#sform').hidden = false; $('#sq').value = keyword; renderRecent(); setTimeout(() => { $('#sq').focus(); $('#sq').select() }, 50) }
function closeSearch() { $('#sform').hidden = true; $('#recent').innerHTML = ''; $('#sq').blur() }
function doSearch(q) {
  q = (q || '').trim().replace(/\s+/g, ' ').slice(0, 80); if (!q) return toast('Ketik kata kunci dulu');
  keyword = q; lsSet('vf_kw', q); lsSet('vf_recent', JSON.stringify([q, ...recents().filter(x => x.toLowerCase() !== q.toLowerCase())].slice(0, 6)));
  closeSearch(); document.querySelectorAll('.slide').forEach(x => io.unobserve(x));
  items = []; nextToken = ''; active = -1; loadingMore = false; scrollTo(0, 0); init();
}
$('#srch').onclick = () => $('#sform').hidden ? openSearch() : closeSearch();
$('#sx').onclick = closeSearch;
$('#sform').onsubmit = e => { e.preventDefault(); doSearch($('#sq').value) };

init();
</script>
</body>
</html>
