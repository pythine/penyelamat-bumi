<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Voice & Gift Room</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0806">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c15a;--gold2:#b8802a;--ink:#07060a;--glass:rgba(20,14,12,.62);--cy:#3fb4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:#fff;font-family:Nunito,system-ui,sans-serif;font-weight:800}
body{background:
 radial-gradient(ellipse 80% 22% at 50% 52%,rgba(245,193,90,.22),transparent 70%),
 radial-gradient(circle at 15% 12%,rgba(255,170,60,.16) 0 2px,transparent 3px) 0 0/46px 52px,
 radial-gradient(circle at 70% 30%,rgba(255,220,150,.12) 0 2px,transparent 3px) 0 0/61px 47px,
 linear-gradient(#050405,#0c0806 55%,#1b1007)}
.scr{max-width:520px;margin:0 auto;height:100dvh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.avsel{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0 18px}
.avsel button.pav{padding:0;display:block}
.pav.ph{display:grid;place-items:center;font-size:40px;border-style:dashed;color:var(--gold)}
.scr.hn{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.col{display:flex;flex-direction:column}
.pg{width:100%;flex:1;min-height:0;overflow-y:auto;padding:4px 2px 14px;scrollbar-width:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.inp{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(245,193,90,.35);border-radius:14px;padding:12px 14px;color:#fff;font:inherit;outline:none}
.inp:focus{border-color:var(--gold)}
textarea.inp{resize:none;display:block}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:999px;background:linear-gradient(#ffd886,#d9962f);color:#2a1700;font-weight:900;text-decoration:none}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:520px;margin:0 auto;display:flex;background:rgba(14,10,8,.96);border-top:1px solid rgba(245,193,90,.25);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:#8d8176;padding:4px 0;border-radius:12px}
.nav button i{font-style:normal;font-size:20px}
.nav button.on{color:var(--gold)}
/* setup */
.avg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.avg button{padding:0;border-radius:50%;aspect-ratio:1;overflow:hidden;border:3px solid transparent;background:#1c1410}
.avg button.on{border-color:var(--gold);box-shadow:0 0 14px var(--gold)}
.avg img{width:100%;height:100%;object-fit:cover}
/* header */
.top{display:flex;align-items:center;gap:8px;padding:10px 2px 6px}
.top .t{flex:1;min-width:0}.top .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t small{color:#9a8f86;font-weight:700}
.ib{width:38px;height:38px;border-radius:50%;background:var(--glass);font-size:18px;display:grid;place-items:center}
.ib.plus{background:#5b4ff0}
.chips{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.chip{background:var(--glass);border:1px solid rgba(245,193,90,.35);border-radius:999px;padding:3px 10px;font-size:13px}
.mini{display:flex}.mini img{width:26px;height:26px;object-fit:cover;border-radius:50%;border:2px solid var(--gold);margin-left:-6px;background:#1c1410}
/* seats */
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 6px;padding:8px 0 10px;border-bottom:1px solid rgba(245,193,90,.12)}
.seat{display:flex;flex-direction:column;align-items:center;min-width:0;cursor:pointer}
.ring{position:relative;width:min(15.5vw,76px);aspect-ratio:1;border-radius:50%;padding:4px;
 background:conic-gradient(#5ec8ff,#2b6dff,#b8e6ff,#5ec8ff)}
.ring{--p:4px;overflow:visible}
.ring img{position:absolute;inset:var(--p);width:calc(100% - 2*var(--p));height:calc(100% - 2*var(--p));border-radius:50%;object-fit:cover;background:#1c1410;border:2px solid #0a0706;display:block}
.r1{background:conic-gradient(#ffd886,#8a4bff,#ff8ad8,#ffd886)}
.r2{background:conic-gradient(#ff9a1f,#ff3c1f,#ffd24a,#ff9a1f);box-shadow:0 0 12px #ff6a1f88}
.r3{background:conic-gradient(#fff,#9aa3b2,#e8edf5,#fff)}
.r4{background:conic-gradient(#d78bff,#6a4bff,#ffd886,#d78bff)}
.ring.empty{background:none;border:2px dashed rgba(245,193,90,.35);display:grid;place-items:center;color:rgba(245,193,90,.6);font-size:22px}
.ring.talk{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,193,90,.7)}50%{box-shadow:0 0 0 9px rgba(245,193,90,0)}}
.mic{position:absolute;right:-4px;bottom:-2px;font-size:13px;background:#000a;border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.nm{max-width:100%;margin-top:5px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm.dim{color:#7d7066}
.pill{margin-top:3px;min-width:58px;text-align:center;font-size:12px;border:2px solid var(--cy);border-radius:999px;background:rgba(8,18,38,.75);padding:0 10px}
.listen{display:flex;align-items:center;gap:6px;padding:10px 0;overflow:hidden}
.listen .ring{width:38px;--p:2px;padding:2px;flex:none}.listen b{margin-left:auto;color:#cfc6bd}
/* chat */
#chatw{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:16px;margin:2px 0;overflow:hidden;background-size:cover;background-position:center;transition:background .3s}
#chat{flex:1;min-height:0;overflow-y:auto;padding:8px 6px;display:flex;flex-direction:column;gap:8px;
 -webkit-mask-image:linear-gradient(transparent,#000 14%);mask-image:linear-gradient(transparent,#000 14%);scrollbar-width:none}
.row{display:flex;gap:8px;align-items:flex-start;max-width:88%}
.row .av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#1c1410;flex:none}
.bub{background:var(--glass);border-radius:18px;padding:7px 14px;font-size:15px;word-break:break-word}
.bub.sys{color:#c9bdb0;font-size:13px;background:rgba(120,110,100,.28)}
.meta{font-size:12px;color:#d6b98a;margin:0 0 3px 4px}
.bdg{font-style:normal;font-size:10px;background:linear-gradient(#ffd886,#d9962f);color:#2a1700;border-radius:8px;padding:1px 7px;margin-right:4px}
.gbub{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#7a2630,#4a1219);border:2px solid #e0646b;border-radius:18px;padding:6px 16px}
.gbub small{display:block;font-size:12px;color:#ffd3d6;font-weight:700}
.gbub .x{color:var(--gold);font-size:22px;font-style:italic}
.gbub .e{font-size:30px}
.bar{display:flex;align-items:center;gap:6px;padding:8px 0 10px}
.bar .inp{border-radius:999px;border-color:rgba(255,255,255,.1);background:rgba(20,14,12,.7);min-width:0}
.bar .ib{width:38px;height:38px;flex:none;font-size:18px}
.sendb{background:linear-gradient(#ffd886,#d9962f);color:#2a1700;font-size:20px!important}
.micb{background:linear-gradient(#a98bff,#6a4bff)}.giftb{background:linear-gradient(#ffb36b,#ff6a3c)}.themeb{background:linear-gradient(#6be0c3,#2b8fd6)}.voiceb{background:linear-gradient(#ff8b9b,#d9365a)}.voiceb.rec{background:#e11d48;box-shadow:0 0 0 5px #e11d4844;animation:recPulse 1s infinite}@keyframes recPulse{50%{box-shadow:0 0 0 9px #e11d4822}}.voicebubble{background:rgba(30,24,35,.9);border:1px solid #a98bff66;border-radius:18px;padding:10px 12px;min-width:220px}.voicebubble audio{display:none}.voicebubble small{display:block;color:#c9b9e8;font-size:11px;margin-bottom:4px}.voiceplayer{display:flex;align-items:center;gap:9px}.voiceplay{width:38px;height:38px;border:0;border-radius:50%;background:linear-gradient(135deg,#a98bff,#6a4bff);color:#fff;font-size:16px;cursor:pointer;flex:0 0 38px}.voiceplayer span{font-size:12px;color:#e8def8}
/* sheet / fx */
#sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:30}
#sheet>div{width:100%;max-width:520px;max-height:82dvh;overflow:auto;background:#150f0b;border:1.5px solid var(--gold2);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 4px;font-size:20px;color:var(--gold)}.sub{color:#a99d92;margin:0 0 12px;font-size:14px}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.gi{background:rgba(255,255,255,.06);border:1.5px solid rgba(245,193,90,.25);border-radius:16px;padding:10px 4px;position:relative}
.gi.sel{border-color:var(--gold);box-shadow:0 0 10px #f5c15a66}
.gi .e{font-size:38px;display:block}.gi img{height:46px;margin:auto}.gi.lk>*{opacity:.35;filter:blur(1px)}.gi.lk::after{content:'🔒';position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.gi .sw{display:block;height:46px;border-radius:10px;margin:0 6px 4px;border:1px solid #ffffff22}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #ffffff14}
.mrow img{width:34px;height:34px;border-radius:50%;object-fit:cover}.mrow span{flex:1;min-width:0}
.mrow .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sm{background:var(--gold);color:#2a1700;border-radius:999px;padding:5px 12px;font-size:13px}
.sm.o{background:#ffffff18;color:#fff}
.cnt{display:flex;align-items:center;gap:16px;margin:8px 0 14px}.cnt button{width:40px;height:40px;border-radius:50%;background:#ffffff18;font-size:22px}
#fx{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none}
#fx .g{text-align:center;animation:fl 4s ease-in-out forwards}
#fx .big{font-size:min(55vw,260px);line-height:1;filter:drop-shadow(0 0 30px var(--gold))}#fx img{width:min(70vw,320px)}
#fx .ban{display:inline-block;margin-top:10px;padding:8px 20px;border-radius:999px;background:linear-gradient(135deg,#7a2630,#4a1219);border:2px solid #e0646b;font-size:17px}
#fx .gift-fx-video{display:block;width:min(82vw,560px);max-height:62vh;object-fit:contain;border-radius:22px;filter:drop-shadow(0 0 28px #ffd36e);box-shadow:0 0 45px #ffb52b88}
@keyframes fl{0%{transform:translateY(40vh) scale(.4);opacity:0}12%{transform:translateY(0) scale(1.1);opacity:1}20%{transform:scale(1)}85%{transform:translateY(-6vh);opacity:1}100%{transform:translateY(-14vh);opacity:0}}
/* ===== Gift FX berjenjang ===== */
#fx .gs{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
#fx .gs.t5{animation:gShake .5s linear 1.2s 3}
#fx .gm{position:relative;text-align:center;will-change:transform;animation-duration:var(--gd);animation-timing-function:ease-in-out;animation-fill-mode:both}
#fx .gs.t0 .big,#fx .gs.t1 .big{font-size:min(42vw,190px)}
#fx .gs.t3 .big,#fx .gs.t3 img{filter:drop-shadow(0 0 34px #ffd36e) drop-shadow(0 0 70px #ff9d2e88)}
#fx .gs.t4 .big,#fx .gs.t4 img{filter:drop-shadow(0 0 38px #fff1a8) drop-shadow(0 0 90px #ff8a00) drop-shadow(0 0 130px #ff3fb188)}
#fx .gs.t5 .big{font-size:min(70vw,340px)}
#fx .gs.t5 .big,#fx .gs.t5 img{filter:drop-shadow(0 0 44px #fff) drop-shadow(0 0 100px #ffb52b) drop-shadow(0 0 150px #ff3fb1)}
#fx .vig{position:absolute;inset:0;background:radial-gradient(circle,transparent 40%,var(--gc2) 130%);opacity:0;animation:gVig var(--gd) ease both}
#fx .rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(var(--gc) 0 6deg,transparent 6deg 18deg);-webkit-mask-image:radial-gradient(circle,#000,transparent 62%);mask-image:radial-gradient(circle,#000,transparent 62%);opacity:0;animation:gRays var(--gd) linear both}
#fx .flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,transparent 60%);opacity:0;animation:gFlash var(--gd) linear both}
#fx i.p,#fx i.r{position:absolute;font-style:normal;opacity:0;font-size:var(--s,20px)}
#fx i.p{left:50%;top:50%;animation:gBurst 2.4s ease-out var(--dl) both}
#fx i.r{top:-10vh;left:var(--x);animation:gRain var(--rd) linear var(--dl) both}
#fx .gban{position:absolute;left:0;right:0;bottom:16%;text-align:center;animation:gBan var(--gd) ease both}
@keyframes gVig{0%{opacity:0}15%{opacity:.7}80%{opacity:.5}100%{opacity:0}}
@keyframes gRays{0%{opacity:0;transform:rotate(0)}12%{opacity:.4}85%{opacity:.4}100%{opacity:0;transform:rotate(60deg)}}
@keyframes gFlash{0%,8%{opacity:0}10%{opacity:.9}18%{opacity:0}60%{opacity:0}62%{opacity:.5}70%,100%{opacity:0}}
@keyframes gBurst{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{opacity:1}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1);opacity:0}}
@keyframes gRain{0%{transform:translateY(0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translateY(115vh) rotate(var(--rot,360deg));opacity:.9}}
@keyframes gBan{0%,6%{opacity:0;transform:translateY(14px)}14%,82%{opacity:1;transform:none}100%{opacity:0}}
@keyframes gShake{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-2px)}}
@keyframes m-vid{0%{opacity:0;transform:scale(.8)}8%{opacity:1;transform:scale(1)}100%{opacity:1}}
@keyframes m-pop{0%{transform:scale(.2);opacity:0}15%{transform:scale(1.2);opacity:1}25%{transform:scale(1)}85%{opacity:1}100%{transform:scale(.8);opacity:0}}
@keyframes m-rise{0%{transform:translateY(45vh) scale(.5);opacity:0}15%{transform:translateY(0) scale(1.1);opacity:1}80%{transform:translateY(-6vh) scale(1.05);opacity:1}100%{transform:translateY(-22vh) scale(.8);opacity:0}}
@keyframes m-flame{0%{transform:translateY(40vh) scale(.4);opacity:0}15%{transform:translateY(0) scale(1.1) rotate(-4deg);opacity:1}30%{transform:scale(1.2) rotate(4deg)}45%{transform:scale(1) rotate(-4deg)}60%{transform:scale(1.18) rotate(3deg)}85%{opacity:1}100%{transform:translateY(-20vh) scale(.7);opacity:0}}
@keyframes m-drop{0%{transform:translateY(-70vh) rotate(-20deg);opacity:0}18%{transform:translateY(0) rotate(6deg);opacity:1}26%{transform:translateY(-8vh)}34%{transform:translateY(0) rotate(0)}85%{opacity:1}100%{transform:translateY(10vh) scale(.8);opacity:0}}
@keyframes m-rocket{0%{transform:translate(-45vw,55vh) scale(.6);opacity:0}12%{opacity:1}100%{transform:translate(45vw,-65vh) scale(1.3);opacity:0}}
@keyframes m-beat{0%{transform:scale(.2);opacity:0}12%{transform:scale(1);opacity:1}22%{transform:scale(1.25)}32%{transform:scale(1)}42%{transform:scale(1.25)}52%{transform:scale(1)}85%{transform:scale(1.05);opacity:1}100%{transform:scale(1.4);opacity:0}}
@keyframes m-shake{0%{transform:translateY(40vh) scale(.5);opacity:0}15%{transform:translateY(0) scale(1.1);opacity:1}25%{transform:rotate(-8deg)}35%{transform:rotate(8deg)}45%{transform:rotate(-8deg)}55%{transform:rotate(8deg) scale(1.15)}65%{transform:rotate(0) scale(1)}85%{opacity:1}100%{transform:translateY(-18vh) scale(.8);opacity:0}}
@keyframes m-spin{0%{transform:scale(.1) rotate(-540deg);opacity:0}25%{transform:scale(1.15) rotate(0);opacity:1}35%{transform:scale(1)}85%{opacity:1}100%{transform:scale(1.6) rotate(25deg);opacity:0}}
@keyframes m-shine{0%{transform:scale(.2) rotateY(0);opacity:0}25%{transform:scale(1.2) rotateY(360deg);opacity:1}40%{transform:scale(1) rotateY(360deg)}60%{transform:scale(1.1) rotateY(720deg)}85%{opacity:1}100%{transform:scale(1.5) rotateY(720deg);opacity:0}}
@keyframes m-sway{0%{transform:translateY(40vh) rotate(-12deg);opacity:0}15%{transform:translateY(0) rotate(10deg);opacity:1}35%{transform:rotate(-10deg)}55%{transform:rotate(10deg)}75%{transform:rotate(-8deg);opacity:1}100%{transform:translateY(-20vh) rotate(6deg);opacity:0}}
@keyframes m-drive{0%{transform:translateX(-95vw);opacity:0}8%,92%{opacity:1}100%{transform:translateX(95vw);opacity:0}}
@keyframes m-gallop{0%{transform:translate(95vw,0);opacity:0}8%{opacity:1}15%{transform:translate(70vw,-8vh)}30%{transform:translate(45vw,0)}45%{transform:translate(20vw,-8vh)}60%{transform:translate(-5vw,0)}75%{transform:translate(-30vw,-8vh)}92%{opacity:1}100%{transform:translate(-95vw,0);opacity:0}}
@keyframes m-fly{0%{transform:translate(-60vw,40vh) rotate(-15deg);opacity:0}12%{opacity:1}100%{transform:translate(60vw,-45vh) rotate(-15deg);opacity:0}}
@keyframes m-swoop{0%{transform:translate(-95vw,-20vh);opacity:0}8%{opacity:1}25%{transform:translate(-45vw,15vh)}50%{transform:translate(0,-15vh)}75%{transform:translate(45vw,15vh)}92%{opacity:1}100%{transform:translate(95vw,-20vh);opacity:0}}
@keyframes m-orbit{0%{transform:rotate(-360deg) scale(.1);opacity:0}25%{transform:rotate(0) scale(1.2);opacity:1}85%{transform:rotate(40deg) scale(1.05);opacity:1}100%{transform:rotate(120deg) scale(.4);opacity:0}}
@keyframes m-meteor{0%{transform:translate(60vw,-70vh) scale(.5) rotate(-20deg);opacity:0}15%{opacity:1}30%{transform:translate(0,0) scale(1.3)}70%{transform:translate(-6vw,2vh) scale(1.1);opacity:1}100%{transform:translate(-50vw,60vh) scale(.5);opacity:0}}
@keyframes m-ufo{0%{transform:translate(-80vw,-25vh);opacity:0}10%{opacity:1}25%{transform:translate(-20vw,-5vh) rotate(8deg)}40%{transform:translate(0,-12vh) rotate(-8deg)}60%{transform:translate(0,-5vh) rotate(8deg)}80%{transform:translate(30vw,-20vh) rotate(-6deg);opacity:1}100%{transform:translate(95vw,-35vh);opacity:0}}
@keyframes m-wings{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.1);opacity:1}25%{transform:scaleX(.7)}35%{transform:scaleX(1.1)}45%{transform:scaleX(.7)}55%{transform:scaleX(1.1)}65%{transform:scaleX(.75)}85%{transform:scale(1);opacity:1}100%{transform:translateY(-20vh);opacity:0}}
@keyframes m-bounce{0%{transform:translateY(50vh) scale(.5);opacity:0}15%{transform:translateY(0);opacity:1}25%{transform:translateY(-10vh)}35%{transform:translateY(0)}45%{transform:translateY(-6vh)}55%{transform:translateY(0)}85%{opacity:1}100%{transform:translateY(-14vh);opacity:0}}
@keyframes m-flutter{0%{transform:translate(-70vw,20vh);opacity:0}10%{opacity:1}30%{transform:translate(-30vw,-10vh)}50%{transform:translate(0,10vh)}70%{transform:translate(30vw,-12vh)}90%{opacity:1}100%{transform:translate(70vw,-5vh);opacity:0}}
#entranceFX .ent-video.alpha{mix-blend-mode:normal}
/* Hubungan */
.relcard{padding:12px;border-radius:16px;margin:8px 0;background:var(--glass);border:1.5px solid var(--rc,#f5c15a55);box-shadow:0 0 12px var(--rg,transparent)}
.relcard .rh{display:flex;align-items:center;gap:10px}
.relcard .rh img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--rc,var(--gold))}
.relcard .rh>div{flex:1;min-width:0}
.relcard small{color:#a99d92;font-weight:700}
.relcard .prog{width:100%}
.relk{font-style:normal;font-size:10px;border-radius:8px;padding:1px 7px;background:var(--rc,var(--gold));color:#1a0f00}
.rl1{--rc:#8fa3b8}.rl2{--rc:#5ec8ff}.rl3{--rc:#b48bff}.rl4{--rc:#ff8ad8;--rg:#ff8ad855}.rl5{--rc:#ffb36b;--rg:#ff6a3c66}.rl6{--rc:#ffd36e;--rg:#ffc34daa}
#svipPop .rel-card{border-color:#ff8ad8;background:radial-gradient(circle at 50% 0%,#6a1b5a,#1d0a1a 58%,#100b08);box-shadow:0 0 28px #ff8ad899}
.gi.lk>small.tkc{opacity:1;filter:none;color:#9fe3ff}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:50;background:#000d;border:1px solid var(--gold);border-radius:999px;padding:8px 18px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:92vw}
#toast.on{opacity:1}
/* Popup kenaikan SVIP: tampil tepat di tengah layar untuk semua anggota room */
#svipPop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.58);backdrop-filter:blur(5px);pointer-events:none}
#svipPop.hidden{display:none!important}
#svipPop .svip-card{width:min(90vw,360px);text-align:center;padding:26px 20px 24px;border:2px solid #ffd36e;border-radius:26px;background:radial-gradient(circle at 50% 0%,#76501c,#211306 58%,#100b08);box-shadow:0 0 28px #ffc34d99, inset 0 0 22px #ffd36e22;animation:svipPopIn .55s cubic-bezier(.18,.9,.25,1.3) both}
#svipPop .svip-crown{font-size:48px;line-height:1.1;filter:drop-shadow(0 0 12px #ffd36e)}
#svipPop .svip-title{font-size:15px;letter-spacing:3px;color:#ffe6a8;margin:8px 0 4px}
#svipPop .svip-level{font-size:clamp(34px,10vw,52px);line-height:1.1;font-weight:900;background:linear-gradient(#fff6c9,#ffc247 55%,#c87918);background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:0 4px 18px #ffb52b55}
#svipPop .svip-name{font-size:20px;color:#fff;margin-top:10px;overflow-wrap:anywhere}
#svipPop .svip-desc{font-size:13px;color:#e9cf9d;margin-top:5px}
@keyframes svipPopIn{0%{opacity:0;transform:scale(.55) translateY(25px)}75%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}

/* Friends, replies, tags and private messages */
.replybox{border-left:3px solid var(--gold);background:#0003;border-radius:8px;padding:5px 9px;margin:0 0 6px;font-size:12px;color:#e8c98e}
.replybox b{display:block;color:#ffd886;margin-bottom:2px}
.msgtools{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px}
.msgtools button{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:#e8c98e;background:#ffffff12;border-radius:999px;padding:3px 9px}
.tagged{color:#ffd886;font-weight:900}
.friendcard{display:flex;align-items:center;gap:10px;padding:10px;background:var(--glass);border:1px solid #f5c15a30;border-radius:14px;margin:8px 0}
.friendcard img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.friendcard .finfo{flex:1;min-width:0}.friendcard small{display:block;color:#a99d92}
.dmhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dmhead img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.dmfeed{max-height:48dvh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px 2px}
.dmline{max-width:88%;padding:9px 12px;border-radius:15px;background:#ffffff12;word-break:break-word;align-self:flex-start}
.dmline.mine{align-self:flex-end;background:#76501f88}
.dmline small{display:block;color:#d6b98a;font-size:10px;margin-top:4px}
.dmcomposer{display:flex;gap:6px;align-items:center;margin-top:8px}
/* Check-in harian */
#ckPop{position:fixed;inset:0;z-index:65;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.62);backdrop-filter:blur(5px)}
.ck-card{position:relative;width:min(92vw,380px);text-align:center;padding:22px 14px 16px;border:2px solid #ffd36e;border-radius:26px;background:radial-gradient(circle at 50% 0%,#5a3a10,#1d1208 62%,#100b08);box-shadow:0 0 34px #ffb52b66;animation:svipPopIn .45s ease both}
.ck-x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:#ffffff18;font-size:18px;display:grid;place-items:center}
.ck-ic{font-size:42px;line-height:1.1;filter:drop-shadow(0 0 10px #ffd36e)}
.ck-t{font-size:19px;letter-spacing:2px;color:var(--gold);margin-top:4px}
.ck-s{font-size:13px;color:#e9cf9d;margin-top:4px;font-weight:700}
.ck-g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.ck-d{position:relative;padding:8px 2px;border-radius:14px;background:#ffffff0d;border:1.5px solid #f5c15a30;font-size:11px;color:#cdbfae}
.ck-d b{display:block;font-size:17px;color:#ffe6a8}.ck-d .c{font-size:22px;display:block;line-height:1.3}
.ck-d.done{opacity:.6}.ck-d.done::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:#6be07a;background:#0007;border-radius:13px}
.ck-d.now{border-color:var(--gold);box-shadow:0 0 14px #f5c15a99;background:#f5c15a24;color:#fff;animation:pulse 1.2s ease-in-out infinite}
.ck-d.big{grid-column:span 2;display:flex;align-items:center;justify-content:center;gap:10px}.ck-d.big .c{font-size:30px}
.ck-ok{padding:10px;border-radius:14px;background:#2b7a3b55;border:1.5px solid #6be07a;color:#c8ffd4;margin-bottom:10px;animation:svipPopIn .4s ease both}
/* Status teman: online / mengetik / dibaca */
.fst{display:flex!important;align-items:center;font-weight:700}
.fst .sd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#6a6058;flex:none}
.fst.on{color:#6be07a!important}.fst.on .sd{background:#38e06a;box-shadow:0 0 6px #38e06a}
.fst.typ{color:#ffd886!important}.fst.typ .sd{background:#ffd886;animation:pulse .7s ease-in-out infinite}
.fst.off{color:#a99d92}
.tk{margin-left:6px;color:#b9a98f;font-weight:700}.tk.rd{color:#5ec8ff}
.dmline.typ{display:flex;gap:4px;align-items:center;padding:12px 14px;width:max-content}
.dmline.typ i{width:7px;height:7px;border-radius:50%;background:#d6b98a;animation:tdot 1s infinite ease-in-out}
.dmline.typ i:nth-child(2){animation-delay:.15s}.dmline.typ i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.dmcomposer .inp{min-width:0}
.replyhint{display:flex;justify-content:space-between;align-items:center;background:#5b431e88;border-radius:10px;padding:7px 10px;margin:5px 0;font-size:12px;color:#ffe0a0}
/* Stories 24 jam */
.storybar{display:flex;gap:12px;overflow-x:auto;padding:8px 2px 14px;scrollbar-width:none}
.storyitem{flex:0 0 76px;text-align:center;font-size:11px;color:#e8d8c4;cursor:pointer}
.storyring{width:66px;height:66px;border-radius:50%;padding:3px;margin:0 auto 5px;background:conic-gradient(#ffd886,#ff6a3c,#a84cff,#ffd886);box-shadow:0 0 12px #f5c15a55}
.storyring img{width:100%;height:100%;border:3px solid #160e09;border-radius:50%;object-fit:cover;background:#21150e}
.storyitem small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Border avatar koleksi (dibuka lewat host) */
.mrow .av9w{flex:none}
.bd-aurora{--bg:conic-gradient(#2cffb0,#1fb8ff,#a259ff,#2cffb0);--glow:#2cffb0aa;--deco:'✨'}
.bd-sakura{--bg:conic-gradient(#ffd1e6,#ff7ab8,#fff,#ff7ab8,#ffd1e6);--glow:#ff7ab8aa;--deco:'🌸';--spd:5s}
.bd-api{--bg:conic-gradient(#ffe45c,#ff6a1f,#d11f00,#ff6a1f,#ffe45c);--glow:#ff6a1fcc;--deco:'🔥';--spd:1.6s}
.bd-es{--bg:conic-gradient(#fff,#9fe3ff,#3fb4ff,#9fe3ff,#fff);--glow:#9fe3ffcc;--deco:'❄️';--spd:4s;--dir:reverse}
.bd-petir{--bg:conic-gradient(#fff,#3a7bff,#fff,#1a2bff,#fff);--glow:#3a7bffcc;--deco:'⚡';--spd:.9s}
.bd-zamrud{--bg:conic-gradient(#0fa968,#ffd36e,#0b7a4b,#ffd36e,#0fa968);--glow:#0fa968aa;--deco:'🍀';--spd:6s}
.bd-samudra{--bg:conic-gradient(#0a4ea3,#1fd1c1,#6be0ff,#1fd1c1,#0a4ea3);--glow:#1fd1c1aa;--deco:'🌊';--spd:3.2s;--dir:reverse}
.bd-bulan{--bg:conic-gradient(#fff,#b9c2d6,#e8edf5,#8793ab,#fff);--glow:#dfe6f5aa;--deco:'🌙';--spd:7s}
.bd-ratu{--bg:conic-gradient(#ff3fb1,#ffd36e,#a84cff,#ffd36e,#ff3fb1);--glow:#ff3fb1aa;--deco:'💎';--spd:3s}
.bd-naga{--bg:conic-gradient(#d11f2e,#ffc247,#7a0f1b,#ffc247,#d11f2e);--glow:#ff4d2ecc;--deco:'🐉';--spd:2.2s}
/* Border eksklusif HOST: cincin emas-mawar-ungu-aqua dengan kilau melintas, glow berdenyut, mahkota melayang */
.bd-host{--bg:conic-gradient(transparent 0 70%,rgba(255,255,255,.95) 82%,transparent 92%),conic-gradient(#ffe9a8,#ff8ad8,#9a7bff,#6be0ff,#ffe9a8);--glow:#ffe9a8;--deco:'👑';--spd:3.4s}
.av9w.bd-host{animation:hostGlowF 2.6s ease-in-out infinite}
.ring.vip9.bd-host{animation:hostGlowB 2.6s ease-in-out infinite}
.ring.vip9.bd-host.talk{animation:pulse .7s ease-in-out infinite}
.av9w.bd-host::after,.ring.vip9.bd-host::after{animation:crownBob 2s ease-in-out infinite}
.ring img.bdimg{inset:-14%;width:128%;height:128%;border:0;border-radius:0;background:none;object-fit:contain;z-index:5;pointer-events:none}
.av9w>img.bdimg{inset:-14%;width:128%!important;height:128%!important;border:0!important;border-radius:0;object-fit:contain;z-index:5;pointer-events:none}
@keyframes hostGlowF{0%,100%{filter:drop-shadow(0 0 5px #ffe9a8) drop-shadow(0 0 12px #9a7bff88)}50%{filter:drop-shadow(0 0 9px #fff) drop-shadow(0 0 22px #ff8ad8aa)}}
@keyframes hostGlowB{0%,100%{box-shadow:0 0 12px #ffe9a8cc,0 0 24px #9a7bff66}50%{box-shadow:0 0 18px #fff,0 0 36px #ff8ad8aa}}
@keyframes crownBob{0%,100%{transform:translateX(-50%) translateY(0) rotate(-10deg)}50%{transform:translateX(-50%) translateY(-3px) rotate(6deg)}}
/* 4 border eksklusif Host (orisinal): berputar + kilau melintas + glow berdenyut */
.av9w[class*="bd-hx-"]{animation:hxGlowF 2.2s ease-in-out infinite}
.ring.vip9[class*="bd-hx-"]{animation:hxGlowB 2.2s ease-in-out infinite}
.ring.vip9[class*="bd-hx-"].talk{animation:pulse .7s ease-in-out infinite}
.av9w[class*="bd-hx-"]::after,.ring.vip9[class*="bd-hx-"]::after{animation:crownBob 2s ease-in-out infinite}
.bd-hx-flame{--bg:conic-gradient(transparent 0 68%,rgba(255,255,255,.9) 80%,transparent 90%),conic-gradient(#ffe45c,#ff6a1f,#b30d00,#ff6a1f,#ffe45c);--glow:#ff5a1f;--deco:'🔥';--spd:1.8s}
.bd-hx-crown{--bg:conic-gradient(transparent 0 60%,rgba(255,255,255,.95) 74%,transparent 86%),conic-gradient(#fff2b0,#d9962f,#fff2b0,#b8802a,#fff2b0);--glow:#ffd36e;--deco:'👑';--spd:3s}
.bd-hx-star{--bg:conic-gradient(transparent 0 72%,rgba(255,255,255,.95) 84%,transparent 94%),conic-gradient(#3fb4ff,#a259ff,#ff7ab8,#ffd36e,#3fb4ff);--glow:#a259ff;--deco:'⭐';--spd:2.4s}
.bd-hx-crystal{--bg:conic-gradient(transparent 0 64%,rgba(255,255,255,.95) 78%,transparent 90%),conic-gradient(#e8fbff,#6be0ff,#8a7bff,#6be0ff,#e8fbff);--glow:#6be0ff;--deco:'💠';--spd:3.6s;--dir:reverse}
@keyframes hxGlowF{0%,100%{filter:drop-shadow(0 0 5px var(--glow)) drop-shadow(0 0 12px var(--glow))}50%{filter:drop-shadow(0 0 9px #fff) drop-shadow(0 0 24px var(--glow))}}
@keyframes hxGlowB{0%,100%{box-shadow:0 0 12px var(--glow),0 0 24px var(--glow)}50%{box-shadow:0 0 18px #fff,0 0 38px var(--glow)}}
/* Video SVIP menyatu dengan ruang: full-screen, tanpa frame/kotak, melintas di layar */
#entranceFX .ent-video-wrap{position:absolute;inset:0;z-index:2;width:100%;height:100%;overflow:hidden;pointer-events:none}
#entranceFX .ent-video{position:absolute;inset:0;display:block;width:100vw;height:100dvh;max-width:none;max-height:none;object-fit:cover;object-position:center;border:0;border-radius:0;outline:0;box-shadow:none;filter:saturate(1.18) contrast(1.08) brightness(1.04);opacity:.88;mix-blend-mode:screen;transform:translateX(0);animation:svipVideoPass 12s cubic-bezier(.2,.65,.25,1) both}
#entranceFX .ent-video-wrap:after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.05) 50%,transparent 100%);mix-blend-mode:screen}
@keyframes svipVideoPass{0%{opacity:0;transform:translateX(14vw) scale(1.08);filter:blur(9px) saturate(1.2)}12%{opacity:.92;filter:blur(0) saturate(1.18)}78%{opacity:.9;transform:translateX(-3vw) scale(1.02)}100%{opacity:0;transform:translateX(-13vw) scale(1.08);filter:blur(8px) saturate(1.2)}}
/* Entrance SVIP 5-9: setiap level punya animasi sendiri */
#entranceFX{position:fixed;inset:0;z-index:65;pointer-events:none;overflow:hidden}
#entranceFX .ent{position:absolute;inset:0;display:grid;place-items:center}
#entranceFX .ent-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--c2),transparent 65%);opacity:0;animation:entBg var(--dur) ease-out both}
#entranceFX .ent-rays,#entranceFX .ent-burst{display:none;position:absolute;left:50%;top:50%}
#entranceFX .ent8 .ent-rays,#entranceFX .ent9 .ent-rays,#entranceFX .ent10 .ent-rays,#entranceFX .ent11 .ent-rays{display:block;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;background:repeating-conic-gradient(var(--c1) 0 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000,transparent 60%);mask-image:radial-gradient(circle,#000,transparent 60%);opacity:0;animation:entRays var(--dur) linear both}
#entranceFX .ent9 .ent-burst,#entranceFX .ent10 .ent-burst,#entranceFX .ent11 .ent-burst{display:block;width:40vmin;height:40vmin;margin:-20vmin 0 0 -20vmin;border-radius:50%;border:4px solid var(--c1);box-shadow:0 0 30px var(--c1),inset 0 0 30px var(--c1);opacity:0;animation:entBurst 1.5s ease-out .5s 3 both}
#entranceFX .ent-sparks i{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4px;border-radius:50%;background:var(--c1);box-shadow:0 0 12px 2px var(--c1);opacity:0;animation:entSpark 2.2s ease-out var(--dl) both}
#entranceFX .ent-move{position:relative;will-change:transform}
#entranceFX .ent-art{font-size:clamp(110px,34vw,220px);line-height:1;filter:drop-shadow(0 0 26px var(--c1)) drop-shadow(0 0 60px var(--c2))}
#entranceFX .ent9 .ent-art{font-size:clamp(130px,42vw,280px)}
#entranceFX .ent-art svg,#entranceFX .ent-art img{display:block;width:clamp(170px,54vw,320px);height:auto}
#entranceFX .ent9 .ent-art svg,#entranceFX .ent9 .ent-art img{width:clamp(210px,68vw,400px)}
#entranceFX .ent-label{position:absolute;left:0;right:0;bottom:16%;padding:0 16px;text-align:center;font-size:clamp(20px,6vw,30px);color:#ffe4a0;text-shadow:0 0 16px var(--c2),0 2px 8px #000;animation:entLabel var(--dur) ease-out both}
#entranceFX .ent-label small{display:block;margin-top:4px;font-size:.55em;letter-spacing:3px;color:var(--c1)}
/* 5 Phoenix: naik dari bawah, sayap mengepak */
#entranceFX .ent5 .ent-move{animation:mv5 var(--dur) ease-out both}
#entranceFX .ent5 .ent-art{animation:flap5 .5s ease-in-out infinite}
/* 6 Naga Emas: meliuk terbang kiri ke kanan */
#entranceFX .ent6 .ent-move{animation:mv6 var(--dur) linear both}
#entranceFX .ent6 .ent-art{animation:wave6 1.4s ease-in-out infinite}
/* 7 Unicorn: berlari kanan ke kiri sambil melompat */
#entranceFX .ent7 .ent-move{animation:mv7 var(--dur) ease-in-out both}
#entranceFX .ent7 .ent-art{animation:gallop7 .5s ease-in-out infinite}
/* 8 Naga Petir: menukik dari langit, kilat menyambar, layar bergetar */
#entranceFX .ent8 .ent-move{animation:mv8 var(--dur) ease-out both}
#entranceFX .ent8 .ent-art{animation:shake8 .12s linear 1s 14}
#entranceFX .ent8 .ent-bg{background:radial-gradient(circle,#dff3ff,var(--c2) 40%,transparent 70%);animation:flash8 var(--dur) linear both}
/* 9 Naga Kaisar: ledakan emas, sinar berputar, gelombang cahaya */
#entranceFX .ent9 .ent-move{animation:mv9 var(--dur) ease-out both}
#entranceFX .ent9 .ent-art{animation:glow9 1.1s ease-in-out infinite}
@keyframes entBg{0%{opacity:0}15%{opacity:.6}80%{opacity:.5}100%{opacity:0}}
@keyframes entRays{0%{transform:rotate(0);opacity:0}15%{opacity:.35}85%{opacity:.35}100%{transform:rotate(50deg);opacity:0}}
@keyframes entBurst{0%{transform:scale(.2);opacity:.95}100%{transform:scale(3.6);opacity:0}}
@keyframes entSpark{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
@keyframes entLabel{0%,12%{opacity:0;transform:translateY(16px)}24%,80%{opacity:1;transform:none}100%{opacity:0}}
@keyframes mv5{0%{transform:translateY(60vh) scale(.35);opacity:0}18%{opacity:1}45%{transform:translateY(-2vh) scale(1.15)}70%{transform:translateY(-6vh) scale(1.22);opacity:1}100%{transform:translateY(-70vh) scale(.7);opacity:0}}
@keyframes flap5{0%,100%{transform:scaleX(1) rotate(-4deg)}50%{transform:scaleX(.78) rotate(4deg)}}
@keyframes mv6{0%{transform:translateX(-85vw);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(85vw);opacity:0}}
@keyframes wave6{0%,100%{transform:translateY(-12vh) rotate(-10deg)}50%{transform:translateY(12vh) rotate(10deg)}}
@keyframes mv7{0%{transform:translateX(85vw);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(-85vw);opacity:0}}
@keyframes gallop7{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8vh) rotate(-7deg)}}
@keyframes mv8{0%{transform:translateY(-80vh) scale(.5);opacity:0}22%{transform:translateY(0) scale(1.35);opacity:1}30%{transform:scale(1)}78%{transform:scale(1.06);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes shake8{0%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-4px)}75%{transform:translate(-4px,-3px)}100%{transform:translate(0,0)}}
@keyframes flash8{0%,20%{opacity:0}22%{opacity:1}25%{opacity:.15}28%{opacity:.9}33%{opacity:.25}70%{opacity:.4}100%{opacity:0}}
@keyframes mv9{0%{transform:scale(0) rotate(-200deg);opacity:0}22%{transform:scale(1.3) rotate(8deg);opacity:1}32%{transform:scale(1) rotate(0)}85%{transform:scale(1.1);opacity:1}100%{transform:scale(2);opacity:0}}
@keyframes glow9{0%,100%{filter:drop-shadow(0 0 22px #fff1a8) drop-shadow(0 0 50px #ff8a00)}50%{filter:drop-shadow(0 0 40px #fff) drop-shadow(0 0 90px #ffb52b)}}
/* 10 Eksklusif: mahkota kerajaan meledak ungu-emas */
#entranceFX .ent10 .ent-move{animation:mv9 var(--dur) ease-out both}
#entranceFX .ent10 .ent-art{animation:glow9 1.1s ease-in-out infinite}
#entranceFX .ent10 .ent-art svg{width:clamp(220px,70vw,420px)}
/* 11 Sultan: terbang naik, sayap emas mengepak, cahaya merah-emas */
#entranceFX .ent11 .ent-move{animation:mv11 var(--dur) ease-out both}
#entranceFX .ent11 .ent-art{animation:glow11 1.3s ease-in-out infinite}
#entranceFX .ent11 .ent-art svg{width:clamp(250px,84vw,500px)}
#entranceFX .ent11 .wl{transform-box:fill-box;transform-origin:100% 50%;animation:wing11L .9s ease-in-out infinite}
#entranceFX .ent11 .wr{transform-box:fill-box;transform-origin:0% 50%;animation:wing11R .9s ease-in-out infinite}
#entranceFX .ent-ban{margin:0 0 10px}#entranceFX .ent-label .svip,#entranceFX .ent-label .svip span{text-shadow:none}#entranceFX .ent-label .svip.big{font-size:clamp(20px,6.4vw,34px);margin:0}
@keyframes mv11{0%{transform:translateY(55vh) scale(.3);opacity:0}20%{transform:translateY(-4vh) scale(1.25);opacity:1}30%{transform:translateY(0) scale(1)}85%{transform:translateY(-2vh) scale(1.08);opacity:1}100%{transform:translateY(-30vh) scale(1.5);opacity:0}}
@keyframes glow11{0%,100%{filter:drop-shadow(0 0 24px #ffe27a) drop-shadow(0 0 60px #e0162f)}50%{filter:drop-shadow(0 0 42px #fff) drop-shadow(0 0 100px #ff3a52)}}
@keyframes wing11L{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes wing11R{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-9deg)}}
/* posts & profile */
.post{background:var(--glass);border:1px solid rgba(245,193,90,.18);border-radius:18px;padding:12px;margin-bottom:12px}
.post .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.post .hd>img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#1c1410;border:2px solid var(--gold)}
.post .hd div{flex:1;min-width:0}
.post .hd small{display:block;color:#9a8f86;font-weight:700;font-size:12px}
.post p{margin:0 0 8px;white-space:pre-wrap;word-break:break-word;font-size:15px;font-weight:700}

/* ===== 3 border eksklusif beranimasi: Sayap Emas, Naga Api, Malam Elegan ===== */
.bd-sayap{--bg:conic-gradient(#fff6c9,#ffd36e,#ffffff,#e0a526,#fff6c9,#ffc247,#fff6c9);--glow:#ffd36e;--deco:'';--spd:2.2s}
.bd-nagaapi{--bg:conic-gradient(#fff3a0,#ff9a1f,#e11d00,#ff5a00,#fff3a0);--glow:#ff5a1f;--deco:'';--spd:1.1s}
.bd-malam{--bg:conic-gradient(#1a0836,#5b2bb8,#d9c2ff,#5b2bb8,#1a0836);--glow:#8a5bff;--deco:'';--spd:5s}
.bdx{position:absolute;left:-40%;right:-40%;top:-30%;bottom:-24%;z-index:5;pointer-events:none}
.bdx svg{display:block;width:100%;height:100%;overflow:visible}
.mrow .bdx{display:none}
.bdx-sayap{animation:bdxGold 2s ease-in-out infinite}
.bdx-nagaapi{animation:bdxNaga .9s ease-in-out infinite alternate}
.bdx-malam{filter:drop-shadow(0 0 3px #b79bff) drop-shadow(0 0 8px #6d3bd199)}
@keyframes bdxGold{0%,100%{filter:drop-shadow(0 0 3px #ffd36e) drop-shadow(0 0 7px #ffb52b88)}50%{filter:drop-shadow(0 0 6px #fff1a8) drop-shadow(0 0 15px #ffb52bcc)}}
@keyframes bdxNaga{from{filter:drop-shadow(0 0 3px #ff7a1f) drop-shadow(0 0 7px #ff3b0088)}to{filter:drop-shadow(0 0 6px #ffd36e) drop-shadow(0 0 14px #ff5a00cc)}}
.bdx .wg{transform-origin:46px 78px;animation:wflap 1.5s ease-in-out infinite}
@keyframes wflap{0%,100%{transform:rotate(0)}50%{transform:rotate(15deg)}}
.bdx .f1{fill:url(#gGold);stroke:#8a5a12;stroke-width:.6}
.bdx .f2{fill:#fff3b8;stroke:#c98a1f;stroke-width:.5}
.bdx .tw,.bdx .st{transform-box:fill-box;transform-origin:center;animation:twk 1.8s ease-in-out infinite}
.bdx .tw{fill:#fff6c9}.bdx .st{fill:#efe4ff}
@keyframes twk{0%,100%{opacity:.15;transform:scale(.4)}50%{opacity:1;transform:scale(1.25)}}
.bdx .dg{transform-origin:46px 132px;animation:dwave 2.6s ease-in-out infinite}
@keyframes dwave{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(3.5deg)}}
.bdx .db{fill:none;stroke:url(#gFire);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.bdx .ds{fill:none;stroke:#ffe9a8;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:.1 6;opacity:.9}
.bdx .dhd{fill:url(#gFire);stroke:#7a1200;stroke-width:.9;stroke-linejoin:round}
.bdx .dhr{fill:#ffd36e;stroke:#7a1200;stroke-width:.7;stroke-linejoin:round}
.bdx .de{fill:#fff7a8;animation:deye 1.1s ease-in-out infinite}
@keyframes deye{0%,100%{opacity:.6}50%{opacity:1}}
.bdx .dfl{fill:url(#gFlame);transform-box:fill-box;transform-origin:0 50%;animation:dflick .3s ease-in-out infinite alternate}
@keyframes dflick{from{transform:scale(.8,.85)}to{transform:scale(1.15,1.1)}}
.bdx .em{fill:#ffd36e;animation:ember 1.8s ease-out infinite}
@keyframes ember{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-20px);opacity:0}}
.bdx .mo{fill:url(#gMoon);stroke:#2a0a52;stroke-width:.6}
.bdx .mn{transform-box:fill-box;transform-origin:center;animation:moonf 3.2s ease-in-out infinite}
.bdx .mn.m2{animation-delay:-1.6s}
@keyframes moonf{0%,100%{transform:translateY(-2px) rotate(-4deg)}50%{transform:translateY(2px) rotate(4deg)}}
.bdx .dm{transform-box:fill-box;transform-origin:center;animation:dmP 1.8s ease-in-out infinite;filter:drop-shadow(0 0 3px #9fe3ff)}
@keyframes dmP{0%,100%{transform:scale(.94)}50%{transform:scale(1.1)}}
.bdx .dmf{fill:url(#gDia);stroke:#cfeaff;stroke-width:.6;stroke-linejoin:round}
.bdx .dml{fill:none;stroke:#fff;stroke-width:.5;opacity:.85}
.bdx .dsp{fill:#fff;transform-box:fill-box;transform-origin:center;animation:twk 1.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.bdx *,.bdx{animation:none!important}}
/* ===== Emoji gerak di foto kursi ===== */
.chip.emochip{padding:3px 8px;display:inline-grid;place-items:center;cursor:pointer}
.chip.emochip .ms{font-size:18px}
.emg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:6px}
.emg button{aspect-ratio:1;border-radius:14px;background:#ffffff0f;border:1px solid #ffffff14;display:grid;place-items:center;font-size:28px;line-height:1}
.emg button.lk{opacity:.4}
.emg button span{display:inline-block}
.emoav{position:absolute;inset:var(--p,4px);border-radius:50%;z-index:6;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#3d2c19,#0d0907);font-size:min(9vw,44px);line-height:1;overflow:hidden;animation:emoIn .25s ease-out both}
.emoav.out{animation:emoOut .3s ease-in forwards}
.emoav span{display:inline-block}
@keyframes emoIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes emoOut{to{transform:scale(.4);opacity:0}}
.ea-shake{animation:eShake .5s ease-in-out infinite}@keyframes eShake{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.ea-roll{animation:eRoll 1.2s ease-in-out infinite}@keyframes eRoll{0%,100%{transform:rotate(-25deg) translateX(-8%)}50%{transform:rotate(25deg) translateX(8%)}}
.ea-pulse{animation:ePulse .8s ease-in-out infinite}@keyframes ePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
.ea-float{animation:eFloat 1.4s ease-in-out infinite}@keyframes eFloat{0%,100%{transform:translateY(8%) scale(.95)}50%{transform:translateY(-10%) scale(1.1)}}
.ea-kiss{animation:eKiss 1s ease-in-out infinite}@keyframes eKiss{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(10deg) scale(1.2)}}
.ea-bounce{animation:eBounce .7s cubic-bezier(.3,.7,.4,1) infinite}@keyframes eBounce{0%,100%{transform:translateY(8%)}50%{transform:translateY(-16%)}}
.ea-spin{animation:eSpin 1.1s linear infinite}@keyframes eSpin{to{transform:rotate(360deg)}}
.ea-zoom{animation:eZoom .6s ease-in-out infinite alternate}@keyframes eZoom{from{transform:scale(.7)}to{transform:scale(1.3)}}
.ea-cry{animation:eCry .5s ease-in-out infinite}@keyframes eCry{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(7%) rotate(4deg)}}
.ea-rage{animation:eRage .22s linear infinite}@keyframes eRage{0%,100%{transform:translate(-3%,0) scale(1.1)}25%{transform:translate(3%,-3%) scale(1.15)}50%{transform:translate(-3%,3%) scale(1.1)}75%{transform:translate(3%,0) scale(1.15)}}
.ea-sway{animation:eSway 1.8s ease-in-out infinite}@keyframes eSway{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.ea-tilt{animation:eTilt 1.2s ease-in-out infinite}@keyframes eTilt{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg) scale(1.1)}}
.ea-clap{animation:eClap .4s ease-in-out infinite alternate}@keyframes eClap{from{transform:scale(1.2,.85)}to{transform:scale(.85,1.2)}}
.ea-thumb{animation:eThumb .9s ease-in-out infinite}@keyframes eThumb{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-22deg) translateY(-12%) scale(1.15)}}
.ea-flame{animation:eFlame .35s ease-in-out infinite alternate}@keyframes eFlame{from{transform:scale(.9,1.1) rotate(-4deg)}to{transform:scale(1.1,.95) rotate(4deg)}}
@media(prefers-reduced-motion:reduce){.emoav span,.emg button span{animation:none!important}}

 background:radial-gradient(circle,transparent 0 30%,#4cff9a2e 30.5% 31.5%,transparent 32% 63%,#4cff9a2e 63.5% 64.5%,transparent 65% 97%,#4cff9a40 97.5% 100%),radial-gradient(circle,#18301f,#0b140e 75%);box-shadow:0 0 26px #4cff9a30 inset,0 0 18px #4cff9a22}

/* ===== SVIP 12 MYTHIC (kemewahan & kekayaan) dan 13 LEGEND (kekuatan, kekayaan, keindahan, keanggunan) ===== */
.svip.s12,.svip.s13{display:inline-flex;align-items:center;position:relative;font-weight:900;isolation:isolate}
.svip.s12{gap:5px;padding:3px 10px;margin:0 6px 0 2px;border-radius:4px 12px;letter-spacing:.2em;border:1.5px solid #ffd76a;background:linear-gradient(135deg,#012d22,#0a7a52 48%,#012d22);box-shadow:0 0 0 1px #012d22,0 0 0 2px #ffd76a99,0 0 14px #35e6a0aa,inset 0 0 9px #fff1a877}

.svip.s13{gap:0;padding:3px 7px;margin:0 10px 0 6px;border-radius:99px;letter-spacing:.22em;border:1.5px solid transparent;background:linear-gradient(135deg,#120a3a,#3b1d78 45%,#7a2a6e 70%,#120a3a) padding-box,linear-gradient(90deg,#fff,#ffd36e,#ff9fcf,#9fd0ff,#fff) border-box;box-shadow:0 0 12px #cfe0ffcc,0 0 26px #ff7ac888,0 0 40px #6a7bff66,inset 0 0 10px #ffffff66}
.svip.s13::before{content:'\265B';position:absolute;left:50%;top:-.95em;transform:translateX(-50%);font-size:1em;line-height:1;color:#ffe08a;text-shadow:0 0 8px #fff,0 0 12px #ffb52b}
.svip.s13 .wg{display:block;flex:none;width:3em;height:2em;margin:-.2em -.25em;background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2060%2040'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23fff'/%3E%3Cstop%20offset='.5'%20stop-color='%23cfe0ff'/%3E%3Cstop%20offset='1'%20stop-color='%23ff9fcf'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg%20fill='url(%23g)'%20stroke='%237a62c8'%20stroke-width='.7'%3E%3Cpath%20d='M58%2022C44%204%2024%200%202%204C16%2010%2030%2014%2044%2024Z'/%3E%3Cpath%20d='M58%2025C42%2014%2024%2012%206%2017C20%2020%2032%2024%2046%2029Z'/%3E%3Cpath%20d='M58%2028C44%2022%2028%2024%2014%2031C28%2030%2038%2031%2048%2033Z'/%3E%3Cpath%20d='M58%2031C48%2030%2036%2033%2028%2039C38%2037%2046%2037%2054%2036Z'/%3E%3C/g%3E%3C/svg%3E") center/contain no-repeat;transform-origin:100% 60%;animation:wingL 1.5s ease-in-out infinite;filter:drop-shadow(0 0 3px #bcd4ff)}
.svip.s13 .wg.r{background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2060%2040'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23fff'/%3E%3Cstop%20offset='.5'%20stop-color='%23cfe0ff'/%3E%3Cstop%20offset='1'%20stop-color='%23ff9fcf'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg%20transform='matrix(-1%200%200%201%2060%200)'%20fill='url(%23g)'%20stroke='%237a62c8'%20stroke-width='.7'%3E%3Cpath%20d='M58%2022C44%204%2024%200%202%204C16%2010%2030%2014%2044%2024Z'/%3E%3Cpath%20d='M58%2025C42%2014%2024%2012%206%2017C20%2020%2032%2024%2046%2029Z'/%3E%3Cpath%20d='M58%2028C44%2022%2028%2024%2014%2031C28%2030%2038%2031%2048%2033Z'/%3E%3Cpath%20d='M58%2031C48%2030%2036%2033%2028%2039C38%2037%2046%2037%2054%2036Z'/%3E%3C/g%3E%3C/svg%3E");transform-origin:0 60%;animation-name:wingR}
.svip.s12 span,.svip.s13 span{display:block;padding:.14em .22em;line-height:1.3;background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;animation:lxSheen 2.6s linear infinite}

function levelChime() {
  try {
    nAC ||= new (window.AudioContext || window.webkitAudioContext)(); if (nAC.state === 'suspended') nAC.resume();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const t = nAC.currentTime + i * .11, o = nAC.createOscillator(), g = nAC.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.14, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + .5);
      o.connect(g).connect(nAC.destination); o.start(t); o.stop(t + .55);
    });
  } catch {}
}

/* ---------- Util gambar: pilih file, kecilkan, unggah ke Storage ---------- */
function pick(cb) { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.onchange = () => i.files[0] && cb(i.files[0]); i.click() }
async function upImg(file, max) {
  const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .85));
  const path = `${uid}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg' });
  if (error) throw error;
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
function pickVideo(cb) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'video/mp4,video/webm,.mp4,.webm';
  i.onchange = () => i.files?.[0] && cb(i.files[0]); i.click();
}
async function upEntranceVideo(file, level) {
  if (!/video\/(mp4|webm)/i.test(file.type) && !/\.(mp4|webm)$/i.test(file.name))
    throw new Error('Pilih video MP4 atau WebM.');
  if (file.size > 30 * 1024 * 1024) throw new Error('Ukuran video maksimal 30 MB.');
  const ext = /\.webm$/i.test(file.name) || file.type === 'video/webm' ? 'webm' : 'mp4';
  const path = `${uid}/svip/entrance-${level}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from('media').upload(path, file, {
    contentType: ext === 'webm' ? 'video/webm' : 'video/mp4', upsert: false
  });
  if (error) throw error;
  return { url: sb.storage.from('media').getPublicUrl(path).data.publicUrl, path, name: file.name };
}
async function loadEntranceVideos() {
  const { data, error } = await sb.from('svip_entrances').select('level,video_url,video_path,video_name');
  if (error) { console.warn('SVIP entrance config:', error.message); return false; }
  entranceVideos = Object.fromEntries((data || []).map(x => [x.level, {
    url: x.video_url, path: x.video_path, name: x.video_name
  }]));
  return true;
}
async function loadGiftVideos() {
  const { data, error } = await sb.from('gift_videos').select('gift_index,video_url,video_path,video_name');
  if (error) { console.warn('Gift video config:', error.message); return false; }
  giftVideos = Object.fromEntries((data || []).map(x => [x.gift_index, {url:x.video_url,path:x.video_path,name:x.video_name}]));
  return true;
}
async function upGiftVideo(file, giftIndex) {
  if (!/video\/(mp4|webm)/i.test(file.type) && !/\.(mp4|webm)$/i.test(file.name)) throw new Error('Pilih video MP4 atau WebM.');
  if (file.size > 30 * 1024 * 1024) throw new Error('Ukuran video maksimal 30 MB.');
  const ext = /\.webm$/i.test(file.name) || file.type === 'video/webm' ? 'webm' : 'mp4';
  const path = `${uid}/gifts/gift-${giftIndex}-${Date.now()}.${ext}`;
  const {error} = await sb.storage.from('media').upload(path,file,{contentType:ext==='webm'?'video/webm':'video/mp4',upsert:false});
  if(error) throw error;
  const {data} = sb.storage.from('media').getPublicUrl(path);
  return {url:data.publicUrl,path,name:file.name};
}

/* Login anonim hanya terjadi saat belum punya sesi. Jika CAPTCHA aktif, token Turnstile wajib: salinan web di domain lain
   (localhost, hosting orang lain) tidak bisa mendapat token karena Site Key terikat ke daftar domain. */
function getCaptchaToken() {
  if (!TURNSTILE_SITE_KEY) return Promise.resolve(undefined);
  return new Promise((resolve, reject) => {
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:200;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#f4e9dc;font:15px system-ui;text-align:center;padding:20px';
    box.innerHTML = '<div id="cfBox"></div><div id="cfMsg">Memeriksa keamanan…</div>';
    document.body.append(box);
    const done = (fn, v) => { box.remove(); fn(v) };
    const draw = () => window.turnstile.render('#cfBox', {
      sitekey: TURNSTILE_SITE_KEY, theme: 'dark', appearance: 'interaction-only',
      callback: t => done(resolve, t),
      'error-callback': () => { box.querySelector('#cfMsg').textContent = 'Verifikasi gagal. Muat ulang halaman, atau buka lewat alamat resmi.' },
      'timeout-callback': () => { box.querySelector('#cfMsg').textContent = 'Verifikasi kedaluwarsa. Muat ulang halaman.' }
    });
    if (window.turnstile) return draw();
    const sc = document.createElement('script'); sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; sc.async = true;
    sc.onload = draw; sc.onerror = () => done(reject, new Error('Gagal memuat CAPTCHA'));
    document.head.append(sc);
  });
}

H.voiceMsg = async () => {
  if (voiceRecorder) return H.voiceStop();
  if (!uid || !me) return toast('Masuk ke room terlebih dahulu.');
  if (!navigator.mediaDevices?.getUserMedia || !(window.AudioContext || window.webkitAudioContext)) return toast('Rekam suara butuh HTTPS dan browser terbaru.');
  try {
    let st; const seatTrack = stream?.getAudioTracks()[0];
    if (seatTrack && seatTrack.readyState === 'live') { const t = seatTrack.clone(); t.enabled = true; st = new MediaStream([t]); } /* sedang duduk: pakai mikrofon yang sama, tetap terekam walau mic dimute */
    else st = await navigator.mediaDevices.getUserMedia(GUM);
    voiceStream = st;
    const ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.resume) await ac.resume();
    const src = ac.createMediaStreamSource(st), node = ac.createScriptProcessor(4096, 1, 1), mute = ac.createGain(); mute.gain.value = 0;
    voiceChunks = []; const t0 = Date.now();
    node.onaudioprocess = e => voiceChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    src.connect(node); node.connect(mute); mute.connect(ac.destination);
    voiceRecorder = { ac, src, node, rate: ac.sampleRate, t0 };
    const btn = $('#voiceMsgBtn'); btn.classList.add('rec'); btn.innerHTML = ms('stop');
    voiceReset.t = setInterval(() => {
      const sec = Math.floor((Date.now() - t0) / 1000);

    if (live) showFx(g, m.name, m.to_name, Number(m.gift));
  } else if (m.type === 'chat' && String(m.body || '').startsWith('[CHEST]')) {
    const [evId, lv] = String(m.body).slice(7).split('|');
    d.innerHTML = `<div class="bub sys">${'📦'} Peti ${Number(lv) >= 10 ? 'EKSKLUSIF' : 'Level ' + Number(lv)} terbuka! Semua anggota room mendapat hadiah</div>`;
    if (live) onChestOpen(evId, Number(lv));

  } else if (m.type === 'voice' || (m.type === 'chat' && String(m.body || '').startsWith('[VOICE_MSG]'))) {
    const audioUrl = m.type === 'voice' ? m.body : String(m.body).slice('[VOICE_MSG]'.length);
    const safeUrl = /^https:\/\//i.test(audioUrl) ? audioUrl : '';
    d.innerHTML = `${head}<div>${meta}<div class="voicebubble"${bubStyle(m.user_id)} data-bu="${m.user_id}"><small>${ms('keyboard_voice')} Pesan suara</small><div class="voiceplayer"><button class="voiceplay" id="voice-play-${Number(m.id)}" onclick="H.toggleVoice(${Number(m.id)})" title="Putar pesan suara"><span class="ms">play_arrow</span></button><span>Putar audio</span><audio id="voice-audio-${Number(m.id)}" data-msgid="${Number(m.id)}" preload="none" src="${esc(safeUrl)}" onended="H.voiceEnded(${Number(m.id)})" onerror="this.parentNode.querySelector('.voiceplay .ms').textContent='error'"></audio></div></div></div>`;
  } else if (m.type === 'chat' && String(m.body || '').startsWith(ONCE_TAG)) {
    d.innerHTML = `${head}<div>${meta}<div class="bub"${bubStyle(m.user_id)} data-bu="${m.user_id}">${onceBubble(String(m.body).slice(ONCE_TAG.length), m.user_id === uid, 'rm', m.created_at)}</div></div>`;
  } else {
    if (m.id != null) { msgCache.set(String(m.id), { id: m.id, body: m.body || '', name: m.name || '', user_id: m.user_id }); if (msgCache.size > 300) msgCache.delete(msgCache.keys().next().value); }
    const quoted = m.reply_to_id ? `<div class="replybox"><b>↩ Membalas pesan</b>${esc(m.reply_preview || 'Pesan sebelumnya')}</div>` : '';
    const body = esc(m.body).replace(/(@[\w.-]+)/g,'<span class="tagged">$1</span>');

  }

/* ---------- Foto sekali lihat: dikirim lewat chat room / chat pribadi, dihapus dari Supabase setelah dilihat ----------
   DM: file dihapus langsung saat penerima membukanya. Room: tiap anggota 1x lihat, file dihapus otomatis setelah 5 menit. */
const ONCE_ROOM_MS = 5 * 60 * 1000, ONCE_DM_MS = 864e5, ONCE_TAG = '[ONCE]';
const onceDone = (() => { try { return new Set(JSON.parse(localStorage.getItem('onceDone') || '[]')) } catch { return new Set() } })();
const onceMark = p => { onceDone.add(p); try { localStorage.setItem('onceDone', JSON.stringify([...onceDone].slice(-300))) } catch {} };
const onceRemove = p => { try { sb.storage.from('media').remove([p]).catch(() => {}) } catch {} };
async function upOnce(file, kind) {
  const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .82)); /* digambar ulang lewat canvas: data EXIF/lokasi foto ikut terbuang */
  const path = `${uid}/once-${kind}-${Date.now()}.jpg`;
  const { error } = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg' });
  if (error) throw error; return path;
}
function onceBubble(path, mine, kind, at) {
  if (mine) return `<span class="once">${ms('photo_camera', 'o')} Foto sekali lihat terkirim</span>`;
  const seen = onceDone.has(path), gone = seen || (kind === 'rm' && Date.now() - Date.parse(at || Date.now()) > ONCE_ROOM_MS);
  return gone ? `<span class="once gone">${ms('visibility_off', 'o')} ${seen ? 'Foto sudah dilihat' : 'Foto kedaluwarsa'}</span>`
    : `<button class="once open" data-once="${esc(path)}" onclick="H.onceOpen(this.dataset.once,'${kind}')">${ms('photo_camera')} <span>Ketuk untuk melihat foto<br><small>sekali lihat · tidak disimpan</small></span></button>`;
}
H.onceOpen = async (path, kind) => {
  if (H.onceOpen.busy || !path) return; if (onceDone.has(path)) return toast('Foto ini sudah dilihat');
  H.onceOpen.busy = true;
  try {
    const url = sb.storage.from('media').getPublicUrl(path).data.publicUrl + '?t=' + Date.now();
    const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error('Foto sudah tidak tersedia');
    const obj = URL.createObjectURL(await r.blob());
    onceMark(path); if (kind === 'dm') onceRemove(path); /* DM: hapus dari Supabase begitu terbuka */
    document.querySelectorAll('[data-once]').forEach(b => { if (b.dataset.once === path) b.outerHTML = `<span class="once gone">${ms('visibility_off', 'o')} Foto sudah dilihat</span>` });
    const e = document.createElement('div'); e.id = 'onceView';
    e.innerHTML = `<p class="ot">Foto sekali lihat · tutup lalu tidak bisa dibuka lagi</p><img draggable="false" src="${obj}"><button>Tutup</button>`;
    e.oncontextmenu = ev => ev.preventDefault();
    const close = () => { URL.revokeObjectURL(obj); e.remove() }; e.querySelector('button').onclick = close;
    document.body.append(e);
  } catch (err) { onceMark(path); toast(err.message || 'Foto tidak tersedia'); document.querySelectorAll('[data-once]').forEach(b => { if (b.dataset.once === path) b.outerHTML = `<span class="once gone">${ms('visibility_off', 'o')} Foto tidak tersedia</span>` }) }
  finally { H.onceOpen.busy = false }
};

      const { data, error } = await sb.from('messages').insert({ user_id: uid, name: me.name, avatar: me.avatar, type: 'chat', body: ONCE_TAG + path, ...ridp() }).select('*').single();

/* ---------- 8A+. Status teman: online, mengetik, dibaca ----------
   Channel 'gp' = presence GLOBAL (semua pengguna yang membuka aplikasi), jadi status online teman tampil
   walau mereka sedang tidak berada di room yang sama. 'typ' dan 'seen' dikirim lewat broadcast channel yang sama. */
function isOn(id) { return !!gOnline[id] || !!online[id] }
function stOf(id) { return typIn[id] ? ['typ', 'mengetik…'] : isOn(id) ? ['on', 'Online'] : ['off', 'Offline'] }
function refreshFriendStatus() {
  document.querySelectorAll('[data-fst]').forEach(e => {
    const [c, t] = stOf(e.dataset.fst);
    e.className = e.className.replace(/\b(on|off|typ)\b/g, '').trim() + ' ' + c;
    e.innerHTML = `<i class="sd"></i>${t}`;
  });
  const tb = $('#dmTyp');
  if (tb && dmPeer) {
    const was = !tb.classList.contains('hidden'), now = !!typIn[dmPeer.id];
    tb.classList.toggle('hidden', !now);
    const f = $('#dmFeed'); if (now && !was && f) f.scrollTop = f.scrollHeight;
  }
}
function updateTicks() {
  dmMessages.forEach(m => {
    if (m.sender_id !== uid) return;
    const e = document.querySelector(`[data-tk="${CSS.escape(String(m.id))}"]`);
    if (e) { e.className = 'tk' + (m.read_at ? ' rd' : ''); e.textContent = m.read_at ? '✓✓ Dibaca' : '✓ Terkirim' }
  });
}
function markDMRead() {
  if (!dmPeer || document.hidden || !dmVisible()) return;
  if (!dmMessages.some(m => m.sender_id === dmPeer.id && m.recipient_id === uid && !m.read_at)) return;
  const now = new Date().toISOString();
  dmMessages.forEach(m => { if (m.sender_id === dmPeer.id && !m.read_at) m.read_at = now });
  if (HAS_READ) sb.from('direct_messages').update({ read_at: now }).eq('sender_id', dmPeer.id).eq('recipient_id', uid).is('read_at', null).then(() => {});
  gp?.send({ type: 'broadcast', event: 'seen', payload: { from: uid, to: dmPeer.id } });
}
H.dmTyping = () => {
  if (!dmPeer || !gp) return;
  const n = Date.now(), to = dmPeer.id;
  if (n - typOut > 2500) { typOut = n; gp.send({ type: 'broadcast', event: 'typ', payload: { from: uid, to, on: true } }) }
  clearTimeout(H.dmTyping.t);
  H.dmTyping.t = setTimeout(() => { typOut = 0; gp?.send({ type: 'broadcast', event: 'typ', payload: { from: uid, to, on: false } }) }, 3000);
};
H.dmStopTyping = () => {
  clearTimeout(H.dmTyping.t);
  if (dmPeer && gp && typOut) gp.send({ type: 'broadcast', event: 'typ', payload: { from: uid, to: dmPeer.id, on: false } });
  typOut = 0;
};
function startGlobalPresence() {
  if (gp || !uid) return;
  sb.from('direct_messages').select('read_at').limit(1).then(r => { HAS_READ = !r.error });
  gp = sb.channel('gp', { config: { presence: { key: uid }, broadcast: { self: false } } })
    .on('presence', { event: 'sync' }, () => { gOnline = gp.presenceState(); refreshFriendStatus(); renderRadar() })
    .on('broadcast', { event: 'typ' }, ({ payload }) => {
      if (!payload || payload.to !== uid) return;
      const f = String(payload.from); clearTimeout(typIn[f]); delete typIn[f];
      if (payload.on) typIn[f] = setTimeout(() => { delete typIn[f]; refreshFriendStatus() }, 4500);
      refreshFriendStatus();
    })
    .on('broadcast', { event: 'seen' }, ({ payload }) => {
      if (!payload || payload.to !== uid) return;
      const now = new Date().toISOString(); let ch = false;
      dmMessages.forEach(m => { if (m.sender_id === uid && m.recipient_id === payload.from && !m.read_at) { m.read_at = now; ch = true } });
      if (ch && dmPeer?.id === payload.from && dmVisible()) updateTicks();
    })
    .subscribe(async st => { if (st === 'SUBSCRIBED') { await gpTrack() } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { markDMRead(); gpTrack() } });
}

/* ---------- 8C. Check-in harian ----------
   Hari 1..7 = 5, 15, 25, 35, 45, 55, 65 koin emas. Setelah hari ke-7 kembali ke hari 1.
   Logika & penambahan koin ada di server (checkin.sql) supaya tidak bisa dicurangi. Hari berganti pukul 00:00 WIB. */
const CK_REWARDS = [5, 15, 25, 35, 45, 55, 65];
let ckDay0 = '', ckBusy = false;
const ckToday = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' });
async function ckStatus() {
  const { data, error } = await sb.rpc('checkin_status');
  if (error) { console.warn('Check-in:', error.message); return null }
  return data;
}
function ckRender(st, got) {
  const day = Number(st.day) || 1, claimed = !!st.claimed;
  const cells = CK_REWARDS.map((r, k) => {
    const i = k + 1, done = claimed ? i <= day : i < day, now = !claimed && i === day;
    return `<div class="ck-d ${done ? 'done' : ''} ${now ? 'now' : ''} ${i === 7 ? 'big' : ''}"><div>Hari ${i}</div>${i === 7 ? `<span class="c">🎁</span><div><b>+${r}</b>koin</div>` : `<span class="c">🪙</span><b>+${r}</b>`}</div>`;
  }).join('');
  let box = $('#ckPop'); if (!box) { box = document.createElement('div'); box.id = 'ckPop'; document.body.appendChild(box) }
  box.innerHTML = `<div class="ck-card"><button class="ck-x" onclick="H.ckClose()" title="Tutup"><span class="ms">close</span></button>
    <div class="ck-ic">📅</div><div class="ck-t">CHECK-IN HARIAN</div>
    <div class="ck-s">${claimed ? `Hari ke-${day} dari 7 sudah diambil. Kembali lagi besok!` : `Hari ke-${day} dari 7 · masuk setiap hari, hadiah makin besar`}</div>
    <div class="ck-g">${cells}</div>
    ${got ? `<div class="ck-ok">🎉 +${got} Koin Emas masuk ke akunmu!</div>` : ''}
    ${claimed ? `<button class="btn" onclick="H.ckClose()">${got ? 'Mantap!' : 'Tutup'}</button>` : `<button class="btn" onclick="H.ckClaim()">Klaim +${CK_REWARDS[day - 1]} Koin Emas 🪙</button>`}</div>`;
}
H.ckClose = () => { $('#ckPop')?.remove() };
H.ckClaim = async () => {
  if (ckBusy) return; ckBusy = true;
  chestQuiet = Date.now() + 8000; /* cegah notifikasi "koin dari Host" untuk koin check-in */
  const { data, error } = await sb.rpc('daily_checkin'); ckBusy = false;
  if (error) return toast(error.message);
  if (!data?.ok) { toast('Hari ini sudah check-in ✅'); const st = await ckStatus(); if (st) ckRender(st); return }
  me = { ...me, gift_tickets: Number(data.coins ?? ((me.gift_tickets || 0) + data.reward)) };
  ckRender({ claimed: true, day: data.day }, data.reward); renderProf(); syncPointsSoon(300);

/* ---------- 9. Suara: WebRTC (signaling via Supabase Broadcast) ----------
   Aturan: pendengar (tidak duduk) selalu menelepon penghuni kursi; antar penghuni kursi, uid lebih kecil yang menelepon.
   Koneksi yang gagal/putus otomatis dibuat ulang. */
/* TURN dibutuhkan di jaringan seluler/NAT ketat (banyak operator HP). Isi dengan server TURN milikmu
   (mis. akun gratis Metered.ca / Cloudflare Calls / coturn): [{urls:'turn:host:3478', username:'u', credential:'p'}] */
const TURN_CUSTOM = [];
const ICE = [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] },
  ...TURN_CUSTOM,
  /* TURN publik cadangan (bisa tidak stabil) */
  { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:80?transport=tcp', 'turns:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' }];
const voiceWarn = () => { if (Date.now() - (voiceWarn.t || 0) > 20000) { voiceWarn.t = Date.now(); toast('Koneksi suara gagal. Jaringan mungkin butuh server TURN.') } };
const GUM = { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } };
const W = {}, ACS = new Set();
let spk = true; /* speaker: dengar suara orang lain. Terpisah dari mic. */
H.spk = () => {
  spk = !spk; document.querySelectorAll('audio.rtc').forEach(a => a.muted = !spk);
  const b = $('#spkb'); b.innerHTML = ms(spk ? 'volume_up' : 'volume_off'); b.classList.toggle('off', !spk);
  toast(spk ? 'Speaker aktif 🔊' : 'Speaker dimatikan: kamu tidak mendengar suara');
};
const WK = {};
/* Hentikan pemantau suara satu user (interval + AudioContext) agar tidak menggantung setelah orangnya keluar */
function unwatch(id) { WK[id]?.(); delete WK[id]; delete W[id] }
function watch(st, id) {
  if (W[id] === st) return; unwatch(id); W[id] = st;
  const ac = new (window.AudioContext || window.webkitAudioContext)(), an = ac.createAnalyser(); an.fftSize = 256; ACS.add(ac);
  ac.createMediaStreamSource(st).connect(an); const b = new Uint8Array(an.frequencyBinCount);
  const stop = () => { clearInterval(iv); ACS.delete(ac); try { ac.close() } catch {} document.querySelectorAll(`[data-uid="${id}"]`).forEach(e => e.classList.remove('talk')) };
  WK[id] = stop;
  const iv = setInterval(() => {
    if (!st.active) { stop(); return }
    an.getByteFrequencyData(b); const v = b.reduce((a, c) => a + c, 0) / b.length;
    document.querySelectorAll(`[data-uid="${id}"]`).forEach(e => e.classList.toggle('talk', v > 12));
  }, 150);
}
/* HP sering memblokir suara otomatis: setiap sentuhan pertama membuka semua audio */
const wake = () => { ACS.forEach(c => c.state === 'suspended' && c.resume().catch(() => {})); document.querySelectorAll('audio.rtc').forEach(a => { a.muted = !spk; a.paused && a.play().catch(() => {}) }) };
document.addEventListener('pointerdown', wake);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { wake(); syncPeers() } });

const sig = (to, p) => room?.send({ type: 'broadcast', event: 'sig', payload: { to, from: uid, ...p } });
const seatedOthers = () => Object.values(seats).map(s => s.user_id).filter(i => i !== uid);
function drop(k, notify) {
  const o = pcs[k]; if (!o) return;
  clearTimeout(o.t); delete pcs[k]; delete early[k]; try { o.pc.close() } catch {}
  if (notify) sig(k, { bye: 1 }); /* beri tahu lawan agar langsung menyambung ulang, tidak menunggu timeout */
  document.getElementById('a' + k)?.remove(); unwatch(k);
}
function redo(id, o) { if (pcs[id] !== o) return; if (o.init && seatedOthers().includes(id)) connect(id); else drop(id) }
function mkpc(id, init) {
  const old = pcs[id]; if (old) { clearTimeout(old.t); delete pcs[id]; try { old.pc.close() } catch {} }
  const pc = new RTCPeerConnection({ iceServers: ICE });
  const o = pcs[id] = { pc, init, q: early[id] || [] }; early[id] = [];
  pc.onicecandidate = e => e.candidate && sig(id, { c: e.candidate });
  pc.ontrack = e => {
    const st = e.streams[0] || new MediaStream([e.track]);
    let a = document.getElementById('a' + id);
    if (!a) { a = document.createElement('audio'); a.id = 'a' + id; a.className = 'rtc'; a.autoplay = true; a.playsInline = true; a.setAttribute('playsinline', ''); document.body.append(a) }
    a.muted = !spk; a.srcObject = st; watch(st, id);
    e.track.onunmute = () => a.play().catch(() => {});
    a.play().catch(() => toast('Ketuk layar untuk mengaktifkan suara 🔊'));
  };
  pc.onconnectionstatechange = () => {
    if (pcs[id] !== o) return;
    const st = pc.connectionState;
    if (st === 'failed') { voiceWarn(); redo(id, o) }
    else if (st === 'disconnected') setTimeout(() => pcs[id] === o && pc.connectionState !== 'connected' && redo(id, o), 3000);
  };
  if (stream) stream.getTracks().forEach(t => pc.addTrack(t, stream)); else if (init) pc.addTransceiver('audio', { direction: 'recvonly' });
  return o;
}
async function connect(id) {
  const o = mkpc(id, true);
  o.t = setTimeout(() => o.pc.connectionState !== 'connected' && redo(id, o), 10000); /* belum tersambung dalam 10 dtk = ulangi */
  try { await o.pc.setLocalDescription(await o.pc.createOffer()); sig(id, { d: o.pc.localDescription }) } catch {}
}
const flush = o => o.q.splice(0).forEach(c => o.pc.addIceCandidate(c).catch(() => {}));
async function onSig({ to, from, d, c, bye }) {
  if (to !== uid) return;
  if (bye) { drop(from); setTimeout(syncPeers, 600); return }
  try {
    if (d?.type === 'offer') {
      const ex = pcs[from];
      if (ex?.init && ex.pc.signalingState === 'have-local-offer' && uid < from) return; /* dua-duanya menelepon: uid lebih kecil menang */
      const o = mkpc(from, false);
      await o.pc.setRemoteDescription(d); flush(o);
      await o.pc.setLocalDescription(await o.pc.createAnswer()); sig(from, { d: o.pc.localDescription });
    } else if (d?.type === 'answer') {
      const o = pcs[from]; if (o && o.pc.signalingState === 'have-local-offer') { await o.pc.setRemoteDescription(d); flush(o) }
    } else if (c) {
      const o = pcs[from]; if (!o) (early[from] ??= []).push(c); else o.pc.remoteDescription ? o.pc.addIceCandidate(c).catch(() => {}) : o.q.push(c);
    }
  } catch {}
}
function closeAll() { Object.keys(pcs).forEach(k => drop(k, true)) }
function syncPeers() {
  if (!room || sitting) return;
  const ids = seatedOthers(), on = new Set(Object.keys(room.presenceState()));
  Object.keys(pcs).forEach(k => {
    /* yang kita telepon: hanya penghuni kursi. Yang menelepon kita (pendengar): tetap dijaga selama online */
    const keep = pcs[k].init ? ids.includes(k) : (ids.includes(k) || on.has(k));
    if (!keep) drop(k);
  });
  ids.forEach(id => {
    const init = !mySeat || uid < id;
    if (pcs[id] && (pcs[id].init !== init || ['failed', 'closed'].includes(pcs[id].pc.connectionState))) drop(id);
    if (init && !pcs[id]) connect(id);
  });
}
