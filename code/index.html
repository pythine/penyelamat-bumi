<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice & Gift Room</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c15a;--gold2:#b8802a;--ink:#07060a;--glass:rgba(20,14,12,.62);--cy:#3fb4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:#fff;font-family:Nunito,system-ui,sans-serif;font-weight:800}
body{background:
 radial-gradient(ellipse 80% 22% at 50% 52%,rgba(245,193,90,.22),transparent 70%),
 radial-gradient(circle at 15% 12%,rgba(255,170,60,.16) 0 2px,transparent 3px) 0 0/46px 52px,
 radial-gradient(circle at 70% 30%,rgba(255,220,150,.12) 0 2px,transparent 3px) 0 0/61px 47px,
 linear-gradient(#050405,#0c0806 55%,#1b1007)}
.scr{max-width:520px;margin:0 auto;height:100dvh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.avsel{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0 18px}
.avsel button.pav{padding:0;display:block}
.pav.ph{display:grid;place-items:center;font-size:40px;border-style:dashed;color:var(--gold)}
.scr.hn{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.col{display:flex;flex-direction:column}
.pg{width:100%;flex:1;min-height:0;overflow-y:auto;padding:4px 2px 14px;scrollbar-width:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.inp{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(245,193,90,.35);border-radius:14px;padding:12px 14px;color:#fff;font:inherit;outline:none}
.inp:focus{border-color:var(--gold)}
textarea.inp{resize:none;display:block}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:999px;background:linear-gradient(#ffd886,#d9962f);color:#2a1700;font-weight:900;text-decoration:none}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:520px;margin:0 auto;display:flex;background:rgba(14,10,8,.96);border-top:1px solid rgba(245,193,90,.25);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:#8d8176;padding:4px 0;border-radius:12px}
.nav button i{font-style:normal;font-size:20px}
.nav button.on{color:var(--gold)}
/* setup */
.avg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.avg button{padding:0;border-radius:50%;aspect-ratio:1;overflow:hidden;border:3px solid transparent;background:#1c1410}
.avg button.on{border-color:var(--gold);box-shadow:0 0 14px var(--gold)}
.avg img{width:100%;height:100%;object-fit:cover}
/* header */
.top{display:flex;align-items:center;gap:8px;padding:10px 2px 6px}
.top .t{flex:1;min-width:0}.top .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t small{color:#9a8f86;font-weight:700}
.ib{width:38px;height:38px;border-radius:50%;background:var(--glass);font-size:18px;display:grid;place-items:center}
.ib.plus{background:#5b4ff0}
.chips{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.chip{background:var(--glass);border:1px solid rgba(245,193,90,.35);border-radius:999px;padding:3px 10px;font-size:13px}
.mini{display:flex}.mini img{width:26px;height:26px;object-fit:cover;border-radius:50%;border:2px solid var(--gold);margin-left:-6px;background:#1c1410}
/* seats */
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 6px;padding:8px 0 10px;border-bottom:1px solid rgba(245,193,90,.12)}
.seat{display:flex;flex-direction:column;align-items:center;min-width:0;cursor:pointer}
.ring{position:relative;width:min(15.5vw,76px);aspect-ratio:1;border-radius:50%;padding:4px;
 background:conic-gradient(#5ec8ff,#2b6dff,#b8e6ff,#5ec8ff)}
.ring{--p:4px;overflow:visible}
.ring img{position:absolute;inset:var(--p);width:calc(100% - 2*var(--p));height:calc(100% - 2*var(--p));border-radius:50%;object-fit:cover;background:#1c1410;border:2px solid #0a0706;display:block}
.r1{background:conic-gradient(#ffd886,#8a4bff,#ff8ad8,#ffd886)}
.r2{background:conic-gradient(#ff9a1f,#ff3c1f,#ffd24a,#ff9a1f);box-shadow:0 0 12px #ff6a1f88}
.r3{background:conic-gradient(#fff,#9aa3b2,#e8edf5,#fff)}
.r4{background:conic-gradient(#d78bff,#6a4bff,#ffd886,#d78bff)}
.ring.empty{background:none;border:2px dashed rgba(245,193,90,.35);display:grid;place-items:center;color:rgba(245,193,90,.6);font-size:22px}
.ring.talk{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,193,90,.7)}50%{box-shadow:0 0 0 9px rgba(245,193,90,0)}}
.mic{position:absolute;right:-4px;bottom:-2px;font-size:13px;background:#000a;border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.nm{max-width:100%;margin-top:5px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm.dim{color:#7d7066}
.pill{margin-top:3px;min-width:58px;text-align:center;font-size:12px;border:2px solid var(--cy);border-radius:999px;background:rgba(8,18,38,.75);padding:0 10px}
.listen{display:flex;align-items:center;gap:6px;padding:10px 0;overflow:hidden}
.listen .ring{width:38px;--p:2px;padding:2px;flex:none}.listen b{margin-left:auto;color:#cfc6bd}
/* chat */
#chatw{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:16px;margin:2px 0;overflow:hidden;background-size:cover;background-position:center;transition:background .3s}
#chat{flex:1;min-height:0;overflow-y:auto;padding:8px 6px;display:flex;flex-direction:column;gap:8px;
 -webkit-mask-image:linear-gradient(transparent,#000 14%);mask-image:linear-gradient(transparent,#000 14%);scrollbar-width:none}
.row{display:flex;gap:8px;align-items:flex-start;max-width:88%}
.row .av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#1c1410;flex:none}
.bub{background:var(--glass);border-radius:18px;padding:7px 14px;font-size:15px;word-break:break-word}
.bub.sys{color:#c9bdb0;font-size:13px;background:rgba(120,110,100,.28)}
.meta{font-size:12px;color:#d6b98a;margin:0 0 3px 4px}
.bdg{font-style:normal;font-size:10px;background:linear-gradient(#ffd886,#d9962f);color:#2a1700;border-radius:8px;padding:1px 7px;margin-right:4px}
.gbub{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#7a2630,#4a1219);border:2px solid #e0646b;border-radius:18px;padding:6px 16px}
.gbub small{display:block;font-size:12px;color:#ffd3d6;font-weight:700}
.gbub .x{color:var(--gold);font-size:22px;font-style:italic}
.gbub .e{font-size:30px}
.bar{display:flex;align-items:center;gap:6px;padding:8px 0 10px}
.bar .inp{border-radius:999px;border-color:rgba(255,255,255,.1);background:rgba(20,14,12,.7);min-width:0}
.bar .ib{width:38px;height:38px;flex:none;font-size:18px}
.sendb{background:linear-gradient(#ffd886,#d9962f);color:#2a1700;font-size:20px!important}
.micb{background:linear-gradient(#a98bff,#6a4bff)}.giftb{background:linear-gradient(#ffb36b,#ff6a3c)}.themeb{background:linear-gradient(#6be0c3,#2b8fd6)}.voiceb{background:linear-gradient(#ff8b9b,#d9365a)}.voiceb.rec{background:#e11d48;box-shadow:0 0 0 5px #e11d4844;animation:recPulse 1s infinite}@keyframes recPulse{50%{box-shadow:0 0 0 9px #e11d4822}}.voicebubble{background:rgba(30,24,35,.9);border:1px solid #a98bff66;border-radius:18px;padding:10px 12px;min-width:220px}.voicebubble audio{display:block;width:min(250px,65vw);height:38px;margin-top:5px}.voicebubble small{display:block;color:#c9b9e8;font-size:11px;margin-bottom:4px}
/* sheet / fx */
#sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:30}
#sheet>div{width:100%;max-width:520px;max-height:82dvh;overflow:auto;background:#150f0b;border:1.5px solid var(--gold2);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 4px;font-size:20px;color:var(--gold)}.sub{color:#a99d92;margin:0 0 12px;font-size:14px}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.gi{background:rgba(255,255,255,.06);border:1.5px solid rgba(245,193,90,.25);border-radius:16px;padding:10px 4px;position:relative}
.gi.sel{border-color:var(--gold);box-shadow:0 0 10px #f5c15a66}
.gi .e{font-size:38px;display:block}.gi img{height:46px;margin:auto}.gi.lk>*{opacity:.35;filter:blur(1px)}.gi.lk::after{content:'🔒';position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.gi .sw{display:block;height:46px;border-radius:10px;margin:0 6px 4px;border:1px solid #ffffff22}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #ffffff14}
.mrow img{width:34px;height:34px;border-radius:50%;object-fit:cover}.mrow span{flex:1;min-width:0}
.mrow .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sm{background:var(--gold);color:#2a1700;border-radius:999px;padding:5px 12px;font-size:13px}
.sm.o{background:#ffffff18;color:#fff}
.cnt{display:flex;align-items:center;gap:16px;margin:8px 0 14px}.cnt button{width:40px;height:40px;border-radius:50%;background:#ffffff18;font-size:22px}
#fx{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none}
#fx .g{text-align:center;animation:fl 4s ease-in-out forwards}
#fx .big{font-size:min(55vw,260px);line-height:1;filter:drop-shadow(0 0 30px var(--gold))}#fx img{width:min(70vw,320px)}
#fx .ban{display:inline-block;margin-top:10px;padding:8px 20px;border-radius:999px;background:linear-gradient(135deg,#7a2630,#4a1219);border:2px solid #e0646b;font-size:17px}
@keyframes fl{0%{transform:translateY(40vh) scale(.4);opacity:0}12%{transform:translateY(0) scale(1.1);opacity:1}20%{transform:scale(1)}85%{transform:translateY(-6vh);opacity:1}100%{transform:translateY(-14vh);opacity:0}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:50;background:#000d;border:1px solid var(--gold);border-radius:999px;padding:8px 18px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:92vw}
#toast.on{opacity:1}
/* Popup kenaikan SVIP: tampil tepat di tengah layar untuk semua anggota room */
#svipPop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.58);backdrop-filter:blur(5px);pointer-events:none}
#svipPop.hidden{display:none!important}
#svipPop .svip-card{width:min(90vw,360px);text-align:center;padding:26px 20px 24px;border:2px solid #ffd36e;border-radius:26px;background:radial-gradient(circle at 50% 0%,#76501c,#211306 58%,#100b08);box-shadow:0 0 28px #ffc34d99, inset 0 0 22px #ffd36e22;animation:svipPopIn .55s cubic-bezier(.18,.9,.25,1.3) both}
#svipPop .svip-crown{font-size:48px;line-height:1.1;filter:drop-shadow(0 0 12px #ffd36e)}
#svipPop .svip-title{font-size:15px;letter-spacing:3px;color:#ffe6a8;margin:8px 0 4px}
#svipPop .svip-level{font-size:clamp(34px,10vw,52px);line-height:1.1;font-weight:900;background:linear-gradient(#fff6c9,#ffc247 55%,#c87918);background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:0 4px 18px #ffb52b55}
#svipPop .svip-name{font-size:20px;color:#fff;margin-top:10px;overflow-wrap:anywhere}
#svipPop .svip-desc{font-size:13px;color:#e9cf9d;margin-top:5px}
@keyframes svipPopIn{0%{opacity:0;transform:scale(.55) translateY(25px)}75%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}

/* Friends, replies, tags and private messages */
.replybox{border-left:3px solid var(--gold);background:#0003;border-radius:8px;padding:5px 9px;margin:0 0 6px;font-size:12px;color:#e8c98e}
.replybox b{display:block;color:#ffd886;margin-bottom:2px}
.msgtools{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px}
.msgtools button{font-size:11px;color:#e8c98e;background:#ffffff12;border-radius:999px;padding:3px 9px}
.tagged{color:#ffd886;font-weight:900}
.friendcard{display:flex;align-items:center;gap:10px;padding:10px;background:var(--glass);border:1px solid #f5c15a30;border-radius:14px;margin:8px 0}
.friendcard img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.friendcard .finfo{flex:1;min-width:0}.friendcard small{display:block;color:#a99d92}
.dmhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dmhead img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.dmfeed{max-height:48dvh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px 2px}
.dmline{max-width:88%;padding:9px 12px;border-radius:15px;background:#ffffff12;word-break:break-word;align-self:flex-start}
.dmline.mine{align-self:flex-end;background:#76501f88}
.dmline small{display:block;color:#d6b98a;font-size:10px;margin-top:4px}
.dmcomposer{display:flex;gap:6px;align-items:center;margin-top:8px}
.dmcomposer .inp{min-width:0}
.replyhint{display:flex;justify-content:space-between;align-items:center;background:#5b431e88;border-radius:10px;padding:7px 10px;margin:5px 0;font-size:12px;color:#ffe0a0}
/* Stories 24 jam */
.storybar{display:flex;gap:12px;overflow-x:auto;padding:8px 2px 14px;scrollbar-width:none}
.storyitem{flex:0 0 76px;text-align:center;font-size:11px;color:#e8d8c4;cursor:pointer}
.storyring{width:66px;height:66px;border-radius:50%;padding:3px;margin:0 auto 5px;background:conic-gradient(#ffd886,#ff6a3c,#a84cff,#ffd886);box-shadow:0 0 12px #f5c15a55}
.storyring img{width:100%;height:100%;border:3px solid #160e09;border-radius:50%;object-fit:cover;background:#21150e}
.storyitem small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.storyview{position:fixed;inset:0;z-index:70;background:#050405f5;display:grid;place-items:center;padding:20px}
.storyview img{max-width:min(94vw,520px);max-height:78dvh;object-fit:contain;border-radius:18px}
.storyview .scap{max-width:520px;text-align:center;margin-top:12px}
.storyview .sclose{position:absolute;right:20px;top:25px;font-size:28px}
/* Entrance animation untuk SVIP 5+ */
#entranceFX{position:fixed;inset:0;z-index:65;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(35,13,5,.4),transparent 65%)}
#entranceFX .entrance-art{font-size:clamp(100px,32vw,210px);filter:drop-shadow(0 0 28px #ffd36e);animation:entranceRun 3.8s ease-out both}
#entranceFX .entrance-label{font-size:clamp(20px,6vw,30px);text-align:center;color:#ffe4a0;text-shadow:0 0 15px #ff9b26}
@keyframes entranceRun{0%{transform:translateX(-110vw) scale(.45) rotate(-8deg);opacity:0}18%{opacity:1}55%{transform:translateX(0) scale(1.12) rotate(2deg);opacity:1}100%{transform:translateX(110vw) scale(.65);opacity:0}}
/* posts & profile */
.post{background:var(--glass);border:1px solid rgba(245,193,90,.18);border-radius:18px;padding:12px;margin-bottom:12px}
.post .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.post .hd>img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#1c1410;border:2px solid var(--gold)}
.post .hd div{flex:1;min-width:0}
.post .hd small{display:block;color:#9a8f86;font-weight:700;font-size:12px}
.post p{margin:0 0 8px;white-space:pre-wrap;word-break:break-word;font-size:15px;font-weight:700}
.pi{width:100%;border-radius:14px;max-height:380px;object-fit:cover;display:block;background:#1c1410}
.del{color:#e0646b;font-size:18px;padding:4px}
.pf{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 6px}
.pf .pav{display:block;margin:0 auto}
.svip{font-style:normal;font-size:9px;border-radius:7px;padding:1px 6px;margin-right:4px;color:#fff;white-space:nowrap;vertical-align:middle}
.s1{background:linear-gradient(#8fa3b8,#566a80)}.s2{background:linear-gradient(#5ec8ff,#2b6dff)}.s3{background:linear-gradient(#b48bff,#6a4bff)}
.s4{background:linear-gradient(#ff8ad8,#c2269c)}.s5{background:linear-gradient(#ffb36b,#ff4d2e)}.s6{background:linear-gradient(#ffe08a,#d9962f);color:#2a1700;box-shadow:0 0 8px #f5c15a}
.ttl{margin:4px 0;font-size:13px}.ttl small{color:#a99d92;font-weight:700}
.prog{width:70%;height:8px;border-radius:99px;background:#ffffff18;overflow:hidden;margin:6px auto}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffd886,#d9962f)}
.ib.off{opacity:.45}
.lk{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:5px 14px;border-radius:999px;background:#ffffff14;font-size:14px}
.lk.on{background:#7a263088;border:1px solid #e0646b}
.pav{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 18px #f5c15a66;background:#1c1410}
.pf h2{margin:10px 0 6px;font-size:22px}
.stats{display:flex;gap:8px;justify-content:center;margin:8px 0 14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sec{margin:18px 0 10px;color:var(--gold);font-size:17px}
.empty-t{color:#8d8176;text-align:center;padding:24px 0;font-size:14px}
@media(prefers-reduced-motion:reduce){.ring.talk,#fx .g{animation-duration:.01s}}
</style>
</head>
<body>

<!-- ================= SETUP PROFIL ================= -->
<section id="setup" class="scr" style="display:flex;flex-direction:column;justify-content:center">
  <button class="ib" style="position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top))" onclick="H.hostLogin()" title="Login Host">👑</button>
  <h1 style="font-size:30px;margin:0;color:var(--gold)">Welcome Penyelamat Bumi</h1>
  <p class="sub" style="margin-top:4px">Upload foto profil dari HP-mu dan isi nama panggila.</p>
  <div class="avsel" id="avs"></div>
  <input id="nm" class="inp" maxlength="16" placeholder="Nama panggilan">
  <button class="btn" style="margin-top:16px" onclick="H.enter()">Masuk Room</button>
</section>

<!-- ================= ROOM ================= -->
<section id="room" class="scr hn hidden" style="flex-direction:column">
  <div class="top">
    <div class="t"><b id="ttl"></b><small id="sub"></small></div>
    <button class="ib" id="spkb" onclick="H.spk()" title="Speaker (dengar suara)">🔊</button>
    <button class="ib" onclick="H.panel()" title="Panel Host">👑</button>
    <button class="ib" onclick="H.exit()" title="Keluar / ubah profil">⏏</button>
  </div>
  <div class="chips"><span class="chip">🏆 No.5</span><span class="mini" id="mini"></span><span class="chip" id="onl" style="margin-left:auto"></span></div>
  <div id="grid"></div>
  <div class="listen" id="listen"></div>
  <div id="chatw"><div id="chat"></div></div>
  <div id="roomReplyHint"></div>
  <div class="bar">
    <button class="ib" onclick="H.tagRoom()" title="Tag anggota">@</button>
    <input id="msg" class="inp" maxlength="200" placeholder="Katakan sesuatu" autocomplete="off" enterkeyhint="send">
    <button class="ib sendb" onpointerdown="event.preventDefault()" onclick="H.sendMsg()" title="Kirim pesan">➤</button>
    <button class="ib voiceb" id="voiceMsgBtn" onclick="H.voiceMsg()" title="Rekam / kirim pesan suara">🎤</button>
    <button class="ib themeb" onclick="H.themes()" title="Tema chat">🎨</button>
    <button class="ib micb" id="micb" onclick="H.mic()">🎙️</button>
    <button class="ib giftb" onclick="H.gift()">🎁</button>
  </div>
</section>

<!-- ================= POSTINGAN ================= -->
<section id="pgPosts" class="scr hn col hidden">
  <div class="top">
    <div class="t"><b>Postingan</b><small>Dari semua anggota room</small></div>
    <button class="ib plus" onclick="H.compose()" title="Buat postingan">＋</button>
  </div>
  <div class="pg"><div id="storyBar" class="storybar"></div><div id="plist"></div></div>
</section>

<!-- ================= TEMAN ================= -->
<section id="pgFriends" class="scr hn col hidden">
  <div class="top"><div class="t"><b>Teman</b><small>Tambah teman dan mulai percakapan pribadi</small></div>
    <button class="ib plus" onclick="H.findFriends()">＋</button></div>
  <div class="pg" id="friendBox"></div>
</section>

<!-- ================= PROFIL ================= -->
<section id="pgMe" class="scr hn col hidden">
  <div class="top">
    <div class="t"><b>Profil</b><small>Kelola akunmu</small></div>
    <button class="ib" onclick="H.panel()" title="Panel Host">👑</button>
  </div>

async function upImg(file, max) {
  const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .85));
  const path = `${uid}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg' });

    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages', filter: `recipient_id=eq.${uid}` }, p => {

    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'room_settings' }, p => { settings = p.new; renderSeats(); renderTop() })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' }, p => {
      const previous = p.new.id === uid ? me : (prof[p.new.id] || p.old || null);
      const oldLevel = previous ? lvl(previous.points) : 0;
      const newLevel = lvl(p.new.points);
      prof[p.new.id] = { ...prof[p.new.id], ...p.new };
      // Popup ditampilkan di tengah layar seluruh anggota yang sedang berada di room.

/* Rekam pesan suara room dan simpan file audio di Supabase Storage bucket 'media'. */
H.voiceMsg = async () => {
  const btn = $('#voiceMsgBtn');
  if (voiceRecorder && voiceRecorder.state === 'recording') { voiceRecorder.stop(); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('Browser belum mendukung rekam suara. Gunakan Chrome terbaru.');
  try {
    voiceStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
    voiceChunks = [];
    const candidates = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    const mimeType = candidates.find(t => MediaRecorder.isTypeSupported?.(t));
    voiceRecorder = new MediaRecorder(voiceStream, mimeType ? { mimeType } : undefined);
    voiceRecorder.ondataavailable = e => { if (e.data?.size) voiceChunks.push(e.data); };
    voiceRecorder.onerror = () => { toast('Gagal merekam suara. Coba lagi.'); voiceStream?.getTracks().forEach(t=>t.stop()); voiceStream=null; voiceRecorder=null; btn?.classList.remove('rec'); if(btn)btn.textContent='🎤'; };
    voiceRecorder.onstop = async () => {
      const rec = voiceRecorder, chunks = voiceChunks.slice();
      voiceStream?.getTracks().forEach(t=>t.stop()); voiceStream=null; voiceRecorder=null; voiceChunks=[];
      btn?.classList.remove('rec'); if(btn)btn.textContent='🎤';
      const blob = new Blob(chunks, { type: rec?.mimeType || 'audio/webm' });
      if (blob.size < 1000) return toast('Rekaman terlalu singkat. Coba bicara sedikit lebih lama.');
      if (blob.size > 12*1024*1024) return toast('Ukuran pesan suara terlalu besar (maksimal 12 MB).');
      toast('Mengunggah pesan suara…');
      const ext = blob.type.includes('mp4') ? 'm4a' : blob.type.includes('ogg') ? 'ogg' : 'webm';
      const path = `voice/${uid}/${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from('media').upload(path, blob, { contentType: blob.type, upsert:false });
      if (upErr) return toast('Upload suara gagal: '+upErr.message);
      const url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
      const { error } = await sb.from('messages').insert({ user_id:uid, name:me.name, avatar:me.avatar, type:'voice', body:url });
      if (error) return toast('File terunggah, tetapi pesan gagal dikirim: '+error.message);
      toast('Pesan suara terkirim 🎧');
    };
    voiceRecorder.start(); btn?.classList.add('rec'); if(btn)btn.textContent='⏹';
    toast('Sedang merekam… tekan ⏹ untuk mengirim');
  } catch (e) {
    voiceStream?.getTracks().forEach(t=>t.stop()); voiceStream=null; voiceRecorder=null;
    toast(e.name==='NotAllowedError' ? 'Izin mikrofon ditolak. Izinkan akses mikrofon di browser.' : (e.message||'Tidak bisa mengakses mikrofon.'));
  }
};

    catch { toast('Mikrofon ditolak. Izinkan mikrofon, lalu ketuk tombol 🎙️ untuk mencoba lagi.') }
    closeAll(); /* tutup koneksi lama SEBELUM duduk */
    const { error } = await sb.from('seats').insert({ seat_no: n, user_id: uid, name: me.name, avatar: me.avatar });
    if (error) { stopMic(); toast('Kursi sudah terisi') }
  } finally { sitting = false; await loadSeats() }
}

function stopMic() { stream?.getTracks().forEach(t => t.stop()); stream = null }

  if(error){$('#friendResults').textContent=error.message;return;}
  const ids=new Set(friendRows.map(x=>x.id));
  $('#friendResults').innerHTML=(data||[]).map(u=>`<div class="friendcard"><img src="${esc(u.avatar||'')}"><div class="finfo"><b>${esc(u.name)}</b></div>${ids.has(u.id)?'<span class="sm o">Sudah teman</span>':`<button class="sm" onclick="H.requestFriend('${u.id}')">＋ Tambah</button>`}</div>`).join('')||'<p class="empty-t">Anggota tidak ditemukan.</p>';
};
H.requestFriend=async id=>{
  const {error}=await sb.from('friend_requests').insert({sender_id:uid,recipient_id:id,status:'pending'});
  if(error)return toast(error.code==='23505'?'Permintaan sudah pernah dikirim.':error.message);
  toast('Permintaan pertemanan terkirim ✅');H.close();
};
H.acceptFriend=async id=>{
  const {error}=await sb.rpc('accept_friend_request',{request_id:id});
  if(error)return toast(error.message);toast('Sekarang kalian berteman! 🎉');loadFriends();
};
H.openDM=async id=>{
  const u=friendRows.find(x=>x.id===id)||(await sb.from('profiles').select('id,name,avatar').eq('id',id).maybeSingle()).data;
  if(!u)return toast('Teman tidak ditemukan');dmPeer=u;dmReply=null;
  const {data,error}=await sb.from('direct_messages').select('*').or(`and(sender_id.eq.${uid},recipient_id.eq.${id}),and(sender_id.eq.${id},recipient_id.eq.${uid})`).order('created_at',{ascending:true}).limit(100);
  if(error)return toast('Chat pribadi: '+error.message);dmMessages=data||[];renderDM();
};
function renderDM(){
  if(!dmPeer)return;
  const lines=dmMessages.map(m=>{
    const mine=m.sender_id===uid,quoted=m.reply_to_id?dmMessages.find(x=>x.id===m.reply_to_id):null;
    const body=esc(m.body).replace(/(@[\\w.-]+)/g,'<span class="tagged">$1</span>');
    return `<div class="dmline ${mine?'mine':''}">${quoted?`<div class="replybox"><b>↩ ${quoted.sender_id===uid?'Kamu':esc(dmPeer.name)}</b>${esc(quoted.body.slice(0,100))}</div>`:''}${m.forwarded_from_id?'<small>↗ Pesan diteruskan</small>':''}${body}<small>${new Date(m.created_at).toLocaleString('id-ID',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'})}</small><div class="msgtools"><button onclick="H.replyDM('${m.id}')">↩ Balas</button><button onclick="H.forwardDM('${m.id}')">↗ Teruskan</button></div></div>`;
  }).join('');
  sheet(`<div class="dmhead"><img src="${esc(dmPeer.avatar||'')}"><div style="flex:1"><h3 style="margin:0">${esc(dmPeer.name)}</h3><p class="sub" style="margin:0">Pesan pribadi</p></div><button class="sm o" onclick="H.close()">Tutup</button></div><div class="dmfeed" id="dmFeed">${lines||'<p class="empty-t">Belum ada pesan. Mulai percakapan! 👋</p>'}</div><div id="dmReplyHint"></div><div class="dmcomposer"><button class="ib" onclick="H.tagDM()" title="Tag teman">@</button><input id="dmInput" class="inp" maxlength="200" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter')H.sendDM()"><button class="ib sendb" onclick="H.sendDM()">➤</button></div>`);
  const f=$('#dmFeed');if(f)f.scrollTop=f.scrollHeight;renderDMReplyHint();
}
function renderDMReplyHint(){const e=$('#dmReplyHint');if(!e)return;const m=dmMessages.find(x=>x.id===dmReply);e.innerHTML=m?`<div class="replyhint">↩ Membalas: ${esc(m.body.slice(0,70))}<button onclick="H.cancelReplyDM()">✕</button></div>`:'';}
H.replyDM=id=>{dmReply=id;renderDMReplyHint();$('#dmInput')?.focus()};
H.cancelReplyDM=()=>{dmReply=null;renderDMReplyHint()};
H.tagDM=()=>{if(!dmPeer)return;const i=$('#dmInput');i.value=(i.value?i.value+' ':'')+'@'+dmPeer.name.replace(/\\s+/g,'')+' ';i.focus()};
H.sendDM=async()=>{
  if(!dmPeer)return;const i=$('#dmInput'),body=i.value.trim();if(!body)return;
  const {data,error}=await sb.from('direct_messages').insert({sender_id:uid,recipient_id:dmPeer.id,body,reply_to_id:dmReply||null}).select().single();
  if(error)return toast(error.message);dmMessages.push(data);dmReply=null;renderDM();
};
H.forwardDM=async id=>{
  const m=dmMessages.find(x=>x.id===id);if(!m)return;
  const {data,error}=await sb.from('direct_messages').insert({sender_id:uid,recipient_id:dmPeer.id,body:m.body,forwarded_from_id:m.id}).select().single();
  if(error)return toast(error.message);dmMessages.push(data);renderDM();toast('Pesan diteruskan');
};
H.replyRoom=(id,body,name)=>{roomReply={id,body,name};renderRoomReplyHint();$('#msg').focus()};
H.cancelReplyRoom=()=>{roomReply=null;renderRoomReplyHint()};
function renderRoomReplyHint(){const e=$('#roomReplyHint');if(!e)return;e.innerHTML=roomReply?`<div class="replyhint">↩ Membalas ${esc(roomReply.name)}: ${esc(roomReply.body)}<button onclick="H.cancelReplyRoom()">✕</button></div>`:'';}
H.tagRoom=async()=>{
  const {data,error}=await sb.from('profiles').select('id,name').neq('id',uid).limit(40);if(error)return toast(error.message);
  sheet(`<h3>Tag Anggota</h3><p class="sub">Pilih anggota untuk menambahkan tag ke pesan.</p>${(data||[]).map(u=>`<div class="mrow"><span>${esc(u.name)}</span><button class="sm" onclick="H.insertRoomTag('${esc(u.name).replace(/'/g,'&#39;')}')">@ Tag</button></div>`).join('')||'<p class="empty-t">Belum ada anggota lain.</p>'}`);
};
H.insertRoomTag=name=>{const i=$('#msg');i.value=(i.value?i.value+' ':'')+'@'+name.replace(/\\s+/g,'')+' ';H.close();i.focus()};
H.forwardRoom=async id=>{
  const {data,error}=await sb.from('messages').select('id,body,name').eq('id',id).maybeSingle();if(error||!data)return toast('Pesan tidak ditemukan');
  H.doForwardRoom.sourceId=id;
  const {data:fs}=await sb.from('friends').select('friend_id').eq('user_id',uid);const ids=(fs||[]).map(x=>x.friend_id);
  const {data:people}=ids.length?await sb.from('profiles').select('id,name,avatar').in('id',ids):{data:[]};
  sheet(`<h3>Teruskan Pesan</h3><p class="sub">Pilih teman yang akan menerima pesan ini.</p><div class="replybox"><b>Pesan dari ${esc(data.name)}</b>${esc(data.body||'')}</div>${(people||[]).map(u=>`<div class="friendcard"><img src="${esc(u.avatar||'')}"><div class="finfo"><b>${esc(u.name)}</b></div><button class="sm" onclick="H.doForwardRoom('${u.id}')">Teruskan</button></div>`).join('')||'<p class="empty-t">Tambahkan teman terlebih dahulu.</p>'}`);
};
H.doForwardRoom=async friendId=>{
  const {data:src}=await sb.from('messages').select('id,body,name').eq('id',H.doForwardRoom.sourceId).maybeSingle();if(!src)return toast('Pesan asal tidak ditemukan');
  const {error}=await sb.from('direct_messages').insert({sender_id:uid,recipient_id:friendId,body:`↗ Diteruskan dari ${src.name}: ${src.body||''}`});
  if(error)return toast(error.message);H.close();toast('Pesan berhasil diteruskan ✅');
};

/* ---------- 9. Suara: WebRTC (signaling via Supabase Broadcast) ----------
   Aturan: pendengar (tidak duduk) selalu menelepon penghuni kursi; antar penghuni kursi, uid lebih kecil yang menelepon.
   Koneksi yang gagal/putus otomatis dibuat ulang. */
const ICE = [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] },
  /* TURN cadangan untuk jaringan seluler/NAT ketat. Ganti dengan TURN milikmu sendiri bila perlu. */
  { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turns:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' }];
const GUM = { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } };
const W = {};
let spk = true; /* speaker: dengar suara orang lain. Terpisah dari mic. */
H.spk = () => {
  spk = !spk; document.querySelectorAll('audio').forEach(a => a.muted = !spk);
  const b = $('#spkb'); b.textContent = spk ? '🔊' : '🔈'; b.classList.toggle('off', !spk);
  toast(spk ? 'Speaker aktif 🔊' : 'Speaker dimatikan: kamu tidak mendengar suara');
};
function watch(st, id) {
  if (W[id] === st) return; W[id] = st;
  const ac = new (window.AudioContext || window.webkitAudioContext)(), an = ac.createAnalyser(); an.fftSize = 256;
  ac.createMediaStreamSource(st).connect(an); const b = new Uint8Array(an.frequencyBinCount);
  const iv = setInterval(() => {
    if (!st.active) { clearInterval(iv); return ac.close() }
    an.getByteFrequencyData(b); const v = b.reduce((a, c) => a + c, 0) / b.length;
    document.querySelectorAll(`[data-uid="${id}"]`).forEach(e => e.classList.toggle('talk', v > 12));
  }, 150);
}
/* HP sering memblokir suara otomatis: setiap sentuhan pertama membuka semua audio */
document.addEventListener('pointerdown', () => document.querySelectorAll('audio').forEach(a => a.paused && a.play().catch(() => {})));
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncPeers() });

const sig = (to, p) => room.send({ type: 'broadcast', event: 'sig', payload: { to, from: uid, ...p } });
const seatedOthers = () => Object.values(seats).map(s => s.user_id).filter(i => i !== uid);
function drop(k) {
  const o = pcs[k]; if (!o) return;
  clearTimeout(o.t); delete pcs[k]; try { o.pc.close() } catch {}
  document.getElementById('a' + k)?.remove(); delete W[k];
}
function redo(id, o) { if (pcs[id] !== o) return; if (o.init && seatedOthers().includes(id)) connect(id); else drop(id) }
function mkpc(id, init) {
  const old = pcs[id]; if (old) { clearTimeout(old.t); delete pcs[id]; try { old.pc.close() } catch {} }
  const pc = new RTCPeerConnection({ iceServers: ICE });
  const o = pcs[id] = { pc, init, q: early[id] || [] }; early[id] = [];
  pc.onicecandidate = e => e.candidate && sig(id, { c: e.candidate });
  pc.ontrack = e => {
    let a = document.getElementById('a' + id);
    if (!a) { a = document.createElement('audio'); a.id = 'a' + id; a.autoplay = true; a.playsInline = true; document.body.append(a) }
    a.muted = !spk; a.srcObject = e.streams[0]; watch(e.streams[0], id);
    a.play().catch(() => toast('Ketuk layar untuk mengaktifkan suara 🔊'));
  };
  pc.onconnectionstatechange = () => {
    if (pcs[id] !== o) return;
    const st = pc.connectionState;
    if (st === 'failed') redo(id, o);
    else if (st === 'disconnected') setTimeout(() => pcs[id] === o && pc.connectionState !== 'connected' && redo(id, o), 3000);
  };
  if (stream) stream.getTracks().forEach(t => pc.addTrack(t, stream)); else if (init) pc.addTransceiver('audio', { direction: 'recvonly' });
  return o;
}
async function connect(id) {
  const o = mkpc(id, true);
  o.t = setTimeout(() => o.pc.connectionState !== 'connected' && redo(id, o), 10000); /* belum tersambung dalam 10 dtk = ulangi */
  try { await o.pc.setLocalDescription(await o.pc.createOffer()); sig(id, { d: o.pc.localDescription }) } catch {}
}
const flush = o => o.q.splice(0).forEach(c => o.pc.addIceCandidate(c).catch(() => {}));
async function onSig({ to, from, d, c }) {
  if (to !== uid) return;
  try {
    if (d?.type === 'offer') {
      const ex = pcs[from];
      if (ex?.init && ex.pc.signalingState === 'have-local-offer' && uid < from) return; /* dua-duanya menelepon: uid lebih kecil menang */
      const o = mkpc(from, false);
      await o.pc.setRemoteDescription(d); flush(o);
      await o.pc.setLocalDescription(await o.pc.createAnswer()); sig(from, { d: o.pc.localDescription });
    } else if (d?.type === 'answer') {
      const o = pcs[from]; if (o && o.pc.signalingState === 'have-local-offer') { await o.pc.setRemoteDescription(d); flush(o) }
    } else if (c) {
      const o = pcs[from]; if (!o) (early[from] ??= []).push(c); else o.pc.remoteDescription ? o.pc.addIceCandidate(c).catch(() => {}) : o.q.push(c);
    }
  } catch {}
}
function closeAll() { Object.keys(pcs).forEach(drop) }
function syncPeers() {
  if (!room || sitting) return;
  const ids = seatedOthers(), on = new Set(Object.keys(room.presenceState()));
  Object.keys(pcs).forEach(k => {
    /* yang kita telepon: hanya penghuni kursi. Yang menelepon kita (pendengar): tetap dijaga selama online */
    const keep = pcs[k].init ? ids.includes(k) : (ids.includes(k) || on.has(k));
    if (!keep) drop(k);
  });
  ids.forEach(id => {
    const init = !mySeat || uid < id;
    if (pcs[id] && pcs[id].init !== init) drop(id);
    if (init && !pcs[id]) connect(id);
  });
}
